var cur='vi',subs=[],LSK='tt_lang';
function ok(c){for(var i=0;i<LANGS.length;i++)if(LANGS[i].c===c)return true;return false;}
function guess(){
  var s=null;try{s=localStorage.getItem(LSK);}catch(e){}
  if(s&&ok(s))return s;
  var n=((navigator.languages&&navigator.languages[0])||navigator.language||'vi').toLowerCase();
  if(n.indexOf('zh')===0)return (/tw|hk|mo|hant/.test(n))?'zh-Hant':'zh-Hans';
  return 'vi';
}
function t(k,p){
  var s=(D[cur]&&D[cur][k]);if(s==null)s=D.vi[k];if(s==null)return k;
  if(p)s=s.replace(/\{(\w+)\}/g,function(m,a){return p[a]!=null?p[a]:m;});
  return s;
}
function has(k){return D[cur]&&D[cur][k]!=null||D.vi[k]!=null;}
function apply(root){
  root=root||document;var e,i;
  e=root.querySelectorAll('[data-i18n]');for(i=0;i<e.length;i++)e[i].textContent=t(e[i].getAttribute('data-i18n'));
  e=root.querySelectorAll('[data-i18n-html]');for(i=0;i<e.length;i++)e[i].innerHTML=t(e[i].getAttribute('data-i18n-html'));
  e=root.querySelectorAll('[data-i18n-ph]');for(i=0;i<e.length;i++)e[i].setAttribute('placeholder',t(e[i].getAttribute('data-i18n-ph')));
}
function set(c,silent){
  if(!ok(c))return false;
  var changed=c!==cur;cur=c;
  try{localStorage.setItem(LSK,c);}catch(e){}
  for(var i=0;i<LANGS.length;i++)if(LANGS[i].c===c)document.documentElement.lang=LANGS[i].h;
  document.title=t('title');apply();
  if(changed&&!silent)subs.forEach(function(f){try{f(c);}catch(e){}});
  return changed;
}
function fmtTime(s){
  s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,sp=cur==='vi'?' ':'';
  return (h?t('t.h',{n:h})+sp:'')+t('t.m',{n:m})+sp+t('t.s',{n:r});
}
window.I18N={add:function(c,o){for(var k in o)D[c][k]=o[k];},LANGS:LANGS,t:t,has:has,apply:apply,set:set,fmtTime:fmtTime,on:function(f){subs.push(f);},get lang(){return cur;},
  itemName:function(id){var k='item.'+id;return has(k)?t(k):id;},
  itemDesc:function(id){var k='itemdesc.'+id;return has(k)?t(k):t('itemdesc.default');}};
cur=guess();
document.documentElement.lang=cur==='vi'?'vi':cur;
document.title=t('title');
})();

let seed=20261017;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))>>>0;h=Math.imul(h^(h>>>13),1274126177)>>>0;return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){return(vnoise(x,y)*.5+vnoise(x*2,y*2)*.25+vnoise(x*4,y*4)*.125+vnoise(x*8,y*8)*.0625)/.9375;}

(function gen(){
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    let t=G;
    if(fbm(x*.07+50,y*.07+10)>.66)t=D;
    if(fbm(x*.05+200,y*.05+90)>.70)t=R;
    const coast=12+8*fbm(y*.06,3.3), cE=MW-12-8*fbm(y*.06,9.1), cN=12+8*fbm(x*.06,5.7), cS=MH-12-8*fbm(x*.06,7.7);
    if(x<coast||x>cE||y<cN||y>cS)t=W;
    tiles[y][x]=t;
  }
  // hồ của Thủy Long
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const dx=(x-LAKE.x)/LAKE.rx,dy=(y-LAKE.y)/(LAKE.ry*(1+.18*Math.sin(x*.7)));if(dx*dx+dy*dy<1+.25*fbm(x*.3,y*.3))tiles[y][x]=W;}
  // sông: từ hồ chảy xuống biển phía tây-nam
  let rx=LAKE.x-3,ry=LAKE.y+LAKE.ry-1;
  for(let i=0;i<260&&rx>10;i++){
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const X=Math.round(rx)+a,Y=Math.round(ry)+b;if(X>0&&Y>0&&X<MW&&Y<MH)tiles[Y][X]=W;}
    rx-=.55+.5*Math.abs(Math.sin(i*.13));ry+=Math.sin(i*.09)*.55+.28;
  }
  // quảng trường gạch + đường đá lát
  for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++){const X=SPAWN.x+x,Y=SPAWN.y+y;tiles[Y][X]=(Math.abs(x)>=5||Math.abs(y)>=5)?S:B;}

function atl(img,fw,fh,cols,i,dx,dy,dw,dh){ctx.drawImage(img,(i%cols)*fw,Math.floor(i/cols)*fh,fw,fh,dx,dy,dw,dh);}

function drawPlayer(t){

function drawDog(t){
  const f=(dog.run?4:0)+(Math.floor(t/(dog.run?95:260))%4),b=dog.run?Math.abs(Math.sin(t/72*Math.PI/2))*.2:Math.sin(t/104)*.1;
  const wd=isWater(dog.x,dog.y+7);

}
function drDraw(name,dx,dy,alpha){const r=DR.idx[name];if(!r)return;if(alpha!==undefined)ctx.globalAlpha=alpha;ctx.drawImage(IMG.dragon,r[0],r[1],r[2],r[3],dx+r[4]*DPX,dy+r[5]*DPX,r[2]*DPX,r[3]*DPX);ctx.globalAlpha=1;}
function mFrame(t){ // trả về {name, sink(0..1), extra}
  const e=t-M.t0;
  switch(M.st){
  case'idle':return{n:'idle'+(Math.floor(t/110)%8)};
  case'swim':return{n:'walk'+(Math.floor(t/95)%8)};
  case'wind':return{n:['atk0','atk1','atk2'][Math.min(2,Math.floor(e/150))]};
  case'fire':return{n:'atk3'};
  case'recover':return{n:'atk5'};
  case'hurt':return{n:e<170?'hurt1':'hurt2'};
  case'surge':{const seq=[['dive2',140],['dive3',120],['dive4',140],['dive5',130],['dive6',100]];let a=0;for(const s of seq){if(e<a+s[1])return{n:s[0]};a+=s[1];}return{n:'idle0'};}
  case'rise':{const p=Math.min(1,e/650);return{n:p<.7?'idle'+(Math.floor(t/110)%8):'idle0',sink:1-easeOut(p),rise:1};}
  case'dive':{const p=Math.min(1,e/720);if(p<.3)return{n:'dive0'};if(p<.45)return{n:'dive1'};return{n:'dive1',sink:easeIn((p-.45)/.55)};}
  case'die':{const seq=[['hurt3',160],['hurt4',200],['hurt5',220],['die0',200],['die1',200],['die2',200],['die3',200],['die4',200],['die5',160],['die6',160]];let a=0;for(const s of seq){if(e<a+s[1])return{n:s[0],al:s[0]==='die6'?1-(e-a)/s[1]:1};a+=s[1];}return{n:'die6',al:0};}
  }

}
const easeOut=u=>1-(1-u)*(1-u),easeIn=u=>u*u;
function drawMonster(t){
  if(M.st==='dead')return;

  if(M.st==='fire'&&M.beam){const b=M.beam,e=t-M.t0,img=Math.floor(e/70)%2?IMG.beamB:IMG.beamA;
    const g=Math.min(1,e/90),fade=e>380?Math.max(0,1-(e-380)/90):1,len=b.L*g;
    ctx.save();ctx.globalAlpha=fade;ctx.translate(b.mx,b.my);ctx.scale(M.f,1);ctx.rotate(b.ang);
    ctx.drawImage(img,0,0,img.width,img.height,-4,-img.height*DPX/2,Math.max(10,len+4),img.height*DPX);ctx.restore();}
  // báo hiệu vòng nước trước khi nước phun
  if(M.st==='tele'&&M.tele){}
}
function drawWorldFx(t){
  for(const f of fxs){const u=(t-f.t0)/f.dur;
    if(f.k==='ring'){ctx.globalAlpha=(1-u)*.8;ctx.strokeStyle='rgba('+f.col+',1)';ctx.lineWidth=1;const r=f.r0+(f.r1-f.r0)*u;ctx.beginPath();ctx.ellipse(f.x,f.y,r,r*.36,0,0,7);ctx.stroke();}
    else if(f.k==='bub'){ctx.globalAlpha=(1-u)*.85;ctx.strokeStyle='#e8fbff';ctx.lineWidth=.8;const y=f.y+f.vy*u*(f.dur/1000);ctx.beginPath();ctx.arc(f.x+Math.sin(u*9)*1.5,y,f.s,0,7);ctx.stroke();}
    else if(f.k==='spl'){const s=(t-f.t0)/1000;ctx.globalAlpha=1-u;ctx.fillStyle=u<.5?'#e6fbff':'#7fd4ff';ctx.fillRect(f.x+f.vx*s-f.s/2,f.y+f.vy*s+120*s*s-f.s/2,f.s,f.s);}
  }
  ctx.globalAlpha=1;
  // vòng cảnh báo vùng nước sắp phun
  if(M.st==='tele'&&M.tele){const e=t-M.t0,u=Math.min(1,e/900);ctx.strokeStyle='rgba(255,255,255,'+(.4+.4*Math.sin(t/60))+')';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.ellipse(M.tele.x,M.tele.y,34*u,12*u,0,0,7);ctx.stroke();ctx.fillStyle='rgba(120,210,255,.18)';ctx.fill();}
  // phun nước (cột nước trồi lên trước khi rồng nhô ra) — dùng ngay khung geyser của sheet
}
function drawSlash(f,t){ // hiệu ứng chém tay không: vệt cung pixel quét từ trên xuống phía trước
  const u=Math.min(1,(t-f.t0)/f.dur),e=1-(1-u)*(1-u),a1=-2.1+3.0*e,R=26,cx=4,cy=-17;
  ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.f,1);
  for(let i=0;i<34;i++){const k=i/34,a=a1-k*1.7,al=Math.max(0,Math.min(1,(1-k)*1.15)*(1-u*.55));if(al<=0)continue;
    for(let j=-3;j<=3;j++){const r=R+j*1.6,core=Math.abs(j)<=0,mid=Math.abs(j)===1;
      ctx.globalAlpha=al*(core?1:mid?.8:.45);ctx.fillStyle=core?(k<.3?'#ffffff':'#d8f3ff'):mid?'#8fd6ff':'#3d9bff';

  ctx.globalAlpha=1-u;ctx.fillStyle='#fff';for(let i=0;i<5;i++){const a=a1+.15+i*.2,r=R+4+i*2;ctx.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r*.85),1.6,1.6);}

function drawDrops(t){for(const d of drops){const y=d.y-4+Math.sin(t/260)*2;if(d.exp&&d.exp-t<10000&&Math.floor(t/150)%2)continue;
  if(d.ic){const f=RMETA[d.ic][3],sc=.8333,w=f[2]*sc,h=f[3]*sc;ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(d.x,d.y+5,w*.35,2,0,0,7);ctx.fill();ctx.restore();
    ctx.drawImage(IMG.res,f[0],f[1],f[2],f[3],d.x-w/2,y-h+2,w,h);continue;}const g=ctx.createRadialGradient(d.x,y,1,d.x,y,10);g.addColorStop(0,'rgba(160,230,255,.9)');g.addColorStop(1,'rgba(80,160,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(d.x,y,10,0,7);ctx.fill();ctx.fillStyle='#e8fbff';ctx.fillRect(d.x-2,y-2,4,4);ctx.fillStyle='#4aa8ff';ctx.fillRect(d.x-2,y+1,4,1);ctx.fillRect(d.x-2,y-2,1,4);}}
function draw(){

  const hw=VW/ZOOM/2+TILE,hh=VH/ZOOM/2+TILE,x0=Math.max(0,Math.floor((cam.x-hw)/TILE)),x1=Math.min(MW-1,Math.floor((cam.x+hw)/TILE)),y0=Math.max(0,Math.floor((cam.y-hh)/TILE)),y1=Math.min(MH-1,Math.floor((cam.y+hh)/TILE));

  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)tileDeco(tiles[y][x],x,y,tm);
  drawWorldFx(t);drawDrops(t);
  // xếp theo y: quái, người, chó
  const L=[{y:M.y,f:()=>drawMonster(t)},{y:P.y,f:()=>drawPlayer(t)},{y:dog.y,f:()=>drawDog(t)}];
  {const rcx=Math.ceil(hw/TILE/4)+1,rcy=Math.ceil(hh/TILE/4)+1,ccx=cam.x/TILE>>2,ccy=cam.y/TILE>>2;
   for(let i=-rcx;i<=rcx;i++)for(let j=-rcy;j<=rcy;j++){const a=nodeCell.get((ccx+i)+','+(ccy+j));if(!a)continue;

/* bánh răng 16x16 vẽ bằng công thức (răng cưa 8 cái, lỗ giữa), viền tối + highlight */
function gear(px){
  var N=16,c=document.createElement('canvas');c.width=c.height=N*px;var x=c.getContext('2d'),f=[],i,j;
  for(j=0;j<N;j++){f[j]=[];for(i=0;i<N;i++){
    var dx=i-7.5,dy=j-7.5,r=Math.sqrt(dx*dx+dy*dy),a=Math.atan2(dy,dx);
    var tooth=Math.cos(a*8)>0.15;
    f[j][i]=(r<=5.3||(r<=7.4&&tooth))&&r>2.3;
  }}
  for(j=0;j<N;j++)for(i=0;i<N;i++){
    if(!f[j][i])continue;
    var edge=!(f[j-1]&&f[j-1][i])||!(f[j+1]&&f[j+1][i])||!f[j][i-1]||!f[j][i+1];
    var hole=false;
    x.fillStyle=edge?'#1c2a38':((i+j<12)?'#ffffff':((i+j>17)?'#9db8cd':'#d6e8f6'));
    x.fillRect(i*px,j*px,px,px);

  c.style.imageRendering='pixelated';return c;
}

  if(token)h.Authorization='Bearer '+token;
  return fetch(URL_+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined,keepalive:!!keep}).then(function(r){
    return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null;}catch(e){}return{ok:r.ok,status:r.status,j:j};});
  });
}
function rawErr(r){var j=r&&r.j||{};return String(j.msg||j.error_description||j.message||j.error||('HTTP '+(r&&r.status)));}
function viErr(r){
  var m=rawErr(r),l=m.toLowerCase(),T=I18N.t;
  if(l.indexOf('invalid login')>=0)return T('err.badlogin');
  if(l.indexOf('already registered')>=0||l.indexOf('already been registered')>=0)return T('err.exists');
  if(l.indexOf('at least')>=0&&l.indexOf('password')>=0)return T('err.pw6');
  if(l.indexOf('signups not allowed')>=0||l.indexOf('signup is disabled')>=0)return T('err.signupoff');
  if(l.indexOf('email logins are disabled')>=0||l.indexOf('provider is not enabled')>=0)return T('err.emailoff');
  if(l.indexOf('rate limit')>=0||r.status===429)return T('err.rate');
  return T('err.server',{m:m});
}
function mkSession(j,name){
  if(!j||!j.access_token)return null;
  return{at:j.access_token,rt:j.refresh_token,exp:j.expires_at?j.expires_at*1000:Date.now()+(j.expires_in||3600)*1000,uid:(j.user&&j.user.id)||'',name:name};
}
function persist(){ls(LSK,S?JSON.stringify(S):null);}

function signIn(name,pw){
  var i=0,last=null;
  function next(){
    if(i>=DOMAINS.length)return Promise.resolve({err:last});
    var k=i++;
    return req('/auth/v1/token?grant_type=password','POST',{email:emailOf(name,k),password:pw}).then(function(r){
      if(r.ok){var s=mkSession(r.j,name);if(s)return{s:s};}
      last=r;
      return next();
    });
  }
  return next();
}
function signUp(name,pw){
  var i=0;
  function next(){
    var k=i++;
    return req('/auth/v1/signup','POST',{email:emailOf(name,k),password:pw}).then(function(r){
      if(r.ok){
        var s=mkSession(r.j,name);
        if(s)return{s:s};
        return{err:r,confirmOn:true};
      }
      var l=rawErr(r).toLowerCase();
      if((l.indexOf('invalid')>=0&&l.indexOf('email')>=0)&&i<DOMAINS.length)return next();
      return{err:r};
    });
  }
  return next();
}
function refresh(){
  if(!S)return Promise.resolve(false);
  return req('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:S.rt}).then(function(r){
    if(r.ok){var s=mkSession(r.j,S.name);if(s){S=s;persist();return true;}}
    if(r.status>=400&&r.status<500){S=null;persist();return false;}
    return null;
  },function(){return null;});
}
function ensure(){
  if(!S)return Promise.resolve(false);
  if(S.exp-60000>Date.now())return Promise.resolve(true);
  return refresh();
}

/* ---------- dữ liệu save ---------- */
function collect(){
  var P=G.P,l={};for(var k in G.loot)l[k]=G.loot[k];
  var st=G.stats;return{v:SAVE_V,x:+P.x.toFixed(1),y:+P.y.toFixed(1),f:P.f,hp:Math.round(P.hp),loot:l,stats:{kills:st.kills|0,steps:Math.round(st.steps),sec:Math.round(st.sec)},set:{lang:I18N.lang},cul:{r:{kim:G.cult.r.kim|0,moc:G.cult.r.moc|0,thuy:G.cult.r.thuy|0,hoa:G.cult.r.hoa|0,tho:G.cult.r.tho|0},aw:G.cult.aw?1:0,qi:+G.cult.qi.toFixed(1)}};
}
function migrate(d){/* d.v cũ → mới. Hiện mới có v=1 nên chưa cần. */return d;}
function apply(d){
  if(!d||typeof d!=='object')return;
  d=migrate(d);var P=G.P;
  if(isFinite(d.x)&&isFinite(d.y)){P.x=d.x;P.y=d.y;G.cam.x=P.x;G.cam.y=P.y;G.dog.x=P.x-18;G.dog.y=P.y+4;}
  if(d.f===1||d.f===-1)P.f=d.f;
  P.hp=(isFinite(d.hp)&&d.hp>0)?Math.min(P.maxHp,d.hp):P.maxHp;
  if(d.set&&d.set.lang)I18N.set(d.set.lang,true),markLang();
  if(d.stats&&typeof d.stats==='object'){var st=G.stats;st.kills=+d.stats.kills||0;st.steps=+d.stats.steps||0;st.sec=+d.stats.sec||0;}
  {var c=G.cult,u=(d.cul&&typeof d.cul==='object')?d.cul:{},ur=u.r||{};['kim','moc','thuy','hoa','tho'].forEach(function(e){c.r[e]=Math.max(0,Math.min(100,+ur[e]||0));});c.aw=u.aw===1||u.aw===true;c.qi=Math.max(0,+u.qi||0);}
  if(d.loot&&typeof d.loot==='object'){for(var k in G.loot)delete G.loot[k];for(var n in d.loot){var c=+d.loot[n];if(c>0)G.loot[n]=c;}if(G.lootUI)G.lootUI();}
}
function localGet(uid){var t=ls('tt_save_'+uid);try{return t?JSON.parse(t):null;}catch(e){return null;}}
function localSet(uid,o){ls('tt_save_'+uid,JSON.stringify(o));}
function fetchSave(){
  return req('/rest/v1/saves?select=data,updated_at&user_id=eq.'+encodeURIComponent(S.uid),'GET',null,S.at).then(function(r){
    if(r.ok&&Array.isArray(r.j))return{ok:true,row:r.j[0]||null};
    return{ok:false,r:r};
  },function(){return{ok:false,net:true};});
}

/* ---------- đẩy save lên ---------- */
var lastSt=null;
function status(k,p,bad){lastSt=[k,p,bad];var e=$('accS');if(e){e.textContent=I18N.t(k,p);e.style.color=bad?'#ffb0a0':'#bfe6ff';}}
function hh(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function push(keep,force){
  if(!S||pushing)return Promise.resolve();
  var d=collect(),j=JSON.stringify(d);
  localSet(S.uid,{t:Date.now(),d:d});
  if(!force&&j===lastJson)return Promise.resolve();
  pushing=true;status('st.saving');
  return ensure().then(function(ok){
    if(ok===false){pushing=false;showAuth('err.expired');return;}
    if(ok===null){pushing=false;status('st.offline',null,1);return;}
    return req('/rest/v1/saves?on_conflict=user_id','POST',{user_id:S.uid,version:SAVE_V,data:d,updated_at:new Date().toISOString()},S.at,keep)
      .then(function(r){
        pushing=false;
        if(r.ok){lastJson=j;lastOk=Date.now();status('st.saved',{t:hh()});}
        else status('st.saverr',{m:rawErr(r).slice(0,40)},1);
      },function(){pushing=false;status('st.offline',null,1);});
  });
}

/* ---------- giao diện ---------- */
var css=document.createElement('style');
css.textContent=
'#auth{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#16324a,#0b1620 70%);overflow:auto;padding:20px;box-sizing:border-box;-webkit-user-select:text;user-select:text;touch-action:pan-y}'+

'#auth input:focus{border-color:#6fd3ff}'+

'';
document.head.appendChild(css);

var ov=document.createElement('div');ov.id='auth';
ov.innerHTML=
'<div class="lg" id="aLang"></div>'+
'<form class="card" id="aForm" autocomplete="on">'+
'<h1 data-i18n="game.name"></h1><p class="sub" data-i18n="auth.sub"></p>'+
'<div class="tabs"><button type="button" id="tLogin" class="on" data-i18n="auth.login"></button><button type="button" id="tReg" data-i18n="auth.reg"></button></div>'+
'<input id="aName" type="text" data-i18n-ph="auth.ph.name" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">'+
'<input id="aPw" type="password" data-i18n-ph="auth.ph.pw" maxlength="64" autocomplete="current-password">'+
'<input id="aPw2" type="password" data-i18n-ph="auth.ph.pw2" maxlength="64" autocomplete="new-password" style="display:none">'+
'<div class="err" id="aErr"></div>'+
'<button class="go" id="aGo" type="submit"></button>'+
'<div class="note" data-i18n-html="auth.note"></div>'+
'<div class="note" style="opacity:.7">v1017.2339</div>'+
'</form>';
document.body.appendChild(ov);
var acc=document.createElement('div');acc.id='acc';acc.innerHTML='<span id="accN"></span> · <span id="accS"></span>';
document.body.appendChild(acc);
/* đếm quãng đường + thời gian chơi (chỉ khi đang chơi) */
var lp=null;
setInterval(function(){
  if(!S||window.__pause)return;
  var P=G.P,st=G.stats;st.sec+=.5;
  if(lp){var d=Math.hypot(P.x-lp.x,P.y-lp.y);if(d<60)st.steps+=d/16;}
  lp={x:P.x,y:P.y};
},500);

function setMode(m){
  mode=m;$('tLogin').className=m==='login'?'on':'';$('tReg').className=m==='reg'?'on':'';
  $('aPw2').style.display=m==='reg'?'block':'none';
  $('aPw').autocomplete=m==='reg'?'new-password':'current-password';
  $('aGo').textContent=I18N.t(m==='reg'?'auth.go.reg':'auth.login');
  $('aErr').textContent='';
}
function showAuth(msg){
  window.__pause=true;S=S&&S.uid?S:null;
  ov.style.display='flex';acc.style.display='none';if(window.TTBag)TTBag.show(false);if(window.TTSet)TTSet.show(false);setMode('login');
  $('aErr').textContent=msg?I18N.t(msg):'';busy=false;$('aGo').disabled=false;
}
function enter(){
  ov.style.display='none';acc.style.display='block';if(window.TTBag)TTBag.show(true);if(window.TTSet)TTSet.show(true);$('accN').textContent=S.name;status('st.loaded');
  window.__pause=false;
  clearInterval(timer);timer=setInterval(function(){push(false,false);},10000);
}
function loadAndEnter(){
  /* lấy save mới nhất giữa máy chủ và bản lưu tạm trên máy */
  return fetchSave().then(function(f){
    var loc=localGet(S.uid),pick=null;
    if(f.ok){
      var srv=f.row?{t:Date.parse(f.row.updated_at)||0,d:f.row.data}:null;
      pick=srv;
      if(loc&&(!srv||loc.t>srv.t+1000))pick=loc;
    }else{
      if(f.r&&(f.r.status===401||f.r.status===403)&&/jwt|token/i.test(rawErr(f.r))){S=null;persist();showAuth('err.expired');return;}
      pick=loc; /* offline hoặc lỗi bảng → dùng bản trên máy */
      if(!f.net)setTimeout(function(){status('st.loaderr',{m:rawErr(f.r).slice(0,36)},1);},300);
    }
    var fromSrv=!!(f.ok&&pick&&f.row&&pick.d===f.row.data);
    if(pick)apply(pick.d);
    lastJson=fromSrv?JSON.stringify(collect()):''; /* bản tạm trên máy mới hơn → để lần lưu kế tiếp đẩy lên */
    if(fromSrv)lastOk=Date.parse(f.row.updated_at)||Date.now();
    enter();
    if(f.ok&&!pick)push(false,true); /* tài khoản mới: tạo dòng save đầu tiên */
    if(G.toast)G.toast(I18N.t(pick?'toast.hello_load':'toast.hello_new',{name:S.name}));
  });
}

$('tLogin').onclick=function(){setMode('login');};
$('tReg').onclick=function(){setMode('reg');};
$('aForm').addEventListener('submit',function(e){
  e.preventDefault();if(busy)return;
  var name=norm($('aName').value),pw=$('aPw').value,err=$('aErr');
  if(!/^[a-z0-9_]{3,20}$/.test(name)){err.textContent=I18N.t('err.name');return;}
  if(pw.length<6){err.textContent=I18N.t('err.pw6');return;}
  if(mode==='reg'&&pw!==$('aPw2').value){err.textContent=I18N.t('err.pwmatch');return;}
  busy=true;$('aGo').disabled=true;err.textContent=I18N.t('err.connecting');
  var p=mode==='reg'?signUp(name,pw):signIn(name,pw);
  p.then(function(res){
    busy=false;$('aGo').disabled=false;
    if(res.s){S=res.s;persist();err.textContent='';loadAndEnter();return;}
    if(res.confirmOn){err.textContent=I18N.t('err.confirm');return;}
    err.textContent=viErr(res.err||{status:0,j:{msg:'unknown'}});
  },function(){busy=false;$('aGo').disabled=false;err.textContent=I18N.t('err.nonet');});
});
function logout(){
  if(!confirm(I18N.t('acc.logout.confirm',{name:S&&S.name})))return;
  push(false,true).then(function(){ls(LSK,null);location.reload();});
}
/* thanh chọn ngôn ngữ trên màn hình đăng nhập */
(function(){var box=$('aLang');I18N.LANGS.forEach(function(L){var b=document.createElement('button');b.type='button';b.textContent=L.n;b.dataset.c=L.c;b.onclick=function(){I18N.set(L.c);};box.appendChild(b);});})();
function markLang(){var b=$('aLang').children;for(var i=0;i<b.length;i++)b[i].className=b[i].dataset.c===I18N.lang?'on':'';}
I18N.on(function(){
  I18N.apply(ov);setMode(mode);markLang();
  if(lastSt&&acc.style.display!=='none')status(lastSt[0],lastSt[1],lastSt[2]);
  if(window.TT&&S&&ov.style.display==='none')push(false,false); /* lưu lựa chọn ngôn ngữ vào tài khoản */
});
I18N.apply(ov);markLang();setMode('login');
addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')push(true,false);});
addEventListener('pagehide',function(){push(true,false);});

/* ---------- khởi động ---------- */
window.__pause=true;
(function boot(){
  var t=ls(LSK);if(t){try{S=JSON.parse(t);}catch(e){S=null;}}
  if(!S||!S.rt){showAuth('');return;}
  ov.style.display='flex';$('aErr').textContent=I18N.t('err.entering');$('aGo').disabled=true;
  ensure().then(function(ok){
    if(ok===false){showAuth('err.expired');return;}
    loadAndEnter(); /* ok===null (offline) → loadAndEnter tự dùng bản lưu trên máy */
  });
})();
window.TT={logout:logout,info:function(){return{name:S?S.name:'',lastOk:lastOk};},state:function(){return{S:S,mode:mode,collect:collect};},push:push,apply:apply,signIn:signIn,signUp:signUp};
})();
