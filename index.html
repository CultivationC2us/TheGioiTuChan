var cur='vi',subs=[],LSK='tt_lang';
function ok(c){for(var i=0;i<LANGS.length;i++)if(LANGS[i].c===c)return true;return false;}
function guess(){
  var s=null;try{s=localStorage.getItem(LSK);}catch(e){}
  if(s&&ok(s))return s;
  var n=((navigator.languages&&navigator.languages[0])||navigator.language||'vi').toLowerCase();
  if(n.indexOf('zh')===0)return (/tw|hk|mo|hant/.test(n))?'zh-Hant':'zh-Hans';
  return 'vi';
}
function t(k,p){
  var s=(D[cur]&&D[cur][k]);if(s==null)s=D.vi[k];if(s==null)return k;
  if(p)s=s.replace(/\{(\w+)\}/g,function(m,a){return p[a]!=null?p[a]:m;});
  return s;
}
function has(k){return D[cur]&&D[cur][k]!=null||D.vi[k]!=null;}
function apply(root){
  root=root||document;var e,i;
  e=root.querySelectorAll('[data-i18n]');for(i=0;i<e.length;i++)e[i].textContent=t(e[i].getAttribute('data-i18n'));
  e=root.querySelectorAll('[data-i18n-html]');for(i=0;i<e.length;i++)e[i].innerHTML=t(e[i].getAttribute('data-i18n-html'));
  e=root.querySelectorAll('[data-i18n-ph]');for(i=0;i<e.length;i++)e[i].setAttribute('placeholder',t(e[i].getAttribute('data-i18n-ph')));
}
function set(c,silent){
  if(!ok(c))return false;
  var changed=c!==cur;cur=c;
  try{localStorage.setItem(LSK,c);}catch(e){}
  for(var i=0;i<LANGS.length;i++)if(LANGS[i].c===c)document.documentElement.lang=LANGS[i].h;
  document.title=t('title');apply();
  if(changed&&!silent)subs.forEach(function(f){try{f(c);}catch(e){}});
  return changed;
}
function fmtTime(s){
  s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,sp=cur==='vi'?' ':'';
  return (h?t('t.h',{n:h})+sp:'')+t('t.m',{n:m})+sp+t('t.s',{n:r});
}
window.I18N={add:function(c,o){for(var k in o)D[c][k]=o[k];},LANGS:LANGS,t:t,has:has,apply:apply,set:set,fmtTime:fmtTime,on:function(f){subs.push(f);},get lang(){return cur;},
  itemName:function(id){var k='item.'+id;return has(k)?t(k):id;},
  itemDesc:function(id){var k='itemdesc.'+id;return has(k)?t(k):t('itemdesc.default');}};
cur=guess();
document.documentElement.lang=cur==='vi'?'vi':cur;
document.title=t('title');
})();

let seed=20261017;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))>>>0;h=Math.imul(h^(h>>>13),1274126177)>>>0;return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function vnoiseP(x,y,px,py){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),m=(a,n)=>((a%n)+n)%n;
  const a=hash(m(xi,px),m(yi,py)),b=hash(m(xi+1,px),m(yi,py)),c=hash(m(xi,px),m(yi+1,py)),d=hash(m(xi+1,px),m(yi+1,py));return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

   Tu vi cần để qua tầng n = base·2^(n-1) (gấp đôi mỗi tầng). Mỗi lần đột phá, máu & sát thương nhân thêm ×1,2 (cộng dồn).
   Tu luyện thường chậm (REALM.rate + Thủy châu); thảo dược thô không cho tu vi — phải luyện thành đan (đan phương). */
const realmNeed=l=>l>=TD.REALM.max?Infinity:TD.REALM.base*Math.pow(2,l-1);
const realmMul=l=>Math.pow(TD.REALM.mul,(l||cult.rl)-1);
const qiRate=()=>TD.REALM.rate+STT.qi;
function qiTick(dt){
  if(!cult.dpg&&!(loot['dp.tukhi']>0)){loot['dp.tukhi']=1;cult.dpg=true;lootUI();}   /* tặng đan phương đầu tiên (1 lần) */
  if(!cult.aw||cult.rl>=TD.REALM.max)return;const nd=realmNeed(cult.rl);if(cult.qi<nd)cult.qi=Math.min(nd,cult.qi+dt*qiRate());
}
function breakthrough(){
  if(!cult.aw||cult.rl>=TD.REALM.max||cult.qi<realmNeed(cult.rl)){toast(T('toast.nobreak'));return false;}
  cult.qi-=realmNeed(cult.rl);cult.rl++;recalc();P.hp=P.maxHp;
  toast(T('toast.break',{n:cult.rl,m:(Math.round(TD.REALM.mul*100)/100).toString().replace('.',',')}));return true;
}
function eatDan(n){
  const d=TD.DAN[n];if(!d||!(loot[n]>0))return false;
  if(!cult.aw){toast(T('toast.dan.asleep'));return false;}
  if(cult.rl>=TD.REALM.max){toast(T('toast.dan.max'));return false;}
  if(cult.qi>=realmNeed(cult.rl)){toast(T('toast.dan.full'));return false;}
  lootDec(n);cult.qi+=d.qi;lootUI();toast(T('toast.dan',{name:I18N.itemName(n),n:d.qi}));return true;
}
const matKeys=(el,t)=>TD.RES.filter(g=>g.el===el&&(g.kind==='ore'||g.kind==='tree')&&g.tier>=t).map(g=>g.item);
const ingKeys=k=>k==='@herb1'?TD.RES.filter(g=>g.kind==='herb'&&g.tier===1).map(g=>g.item):k.indexOf('@mat:')===0?matKeys(k.split(':')[1],+k.split(':')[2]):[k];
const ingHave=k=>ingKeys(k).reduce((a,x)=>a+(loot[x]|0),0);
function ingTake(k,q){for(const x of ingKeys(k).sort((a,b)=>(loot[b]|0)-(loot[a]|0))){const t=Math.min(q,loot[x]|0);if(t>0){loot[x]-=t;q-=t;if(loot[x]<=0)delete loot[x];}if(q<=0)break;}}
const recipeOf=(rid,idx)=>{const R=TD.RECIPES[rid];return R&&R.list[idx||0];};
function craftMax(rid,idx){const r=recipeOf(rid,idx);if(!r)return 0;return Math.min(...r.ing.map(([k,q])=>Math.floor(ingHave(k)/q)));}
function craft(rid,n,idx){
  const r=recipeOf(rid,idx);if(!r||!(loot[rid]>0))return 0;n=Math.min(n||1,craftMax(rid,idx));
  if(n<1){toast(T('toast.alc.no'));return 0;}
  r.ing.forEach(([k,q])=>ingTake(k,q*n));
  loot[r.out]=(loot[r.out]|0)+n;lootUI();toast(T('toast.alc',{name:I18N.itemName(r.out),n}));return n;
}

function recalc(){
  const sum=el=>cult.pl[el].reduce((a,b)=>a+b,0),pe=TD.PEARL,rd=x=>Math.round(x*1000)/1000;
  STT.dmg=rd(sum('kim')*pe.kim.per);STT.hp=rd(sum('moc')*pe.moc.per);STT.red=Math.min(.6,rd(sum('tho')*pe.tho.per));STT.spd=rd(sum('hoa')*pe.hoa.per);STT.qi=rd(sum('thuy')*pe.thuy.per);
  if(cult.qi>realmNeed(cult.rl)+TD.DAN['dan.tukhi'].qi)cult.qi=realmNeed(cult.rl);
  const mx=Math.round((100+STT.hp)*realmMul()),old=P.maxHp;P.maxHp=mx;P.hp=mx>old?Math.min(mx,P.hp+(mx-old)):Math.min(P.hp,mx);
}
/* ---------- DEF · TÚI CÓ DUNG TÍCH ---------- */
const defVal=()=>Math.round(TD.BASE.def*realmMul())+['h','o','g'].reduce((a,k)=>a+((cult.eq[k]&&loot[cult.eq[k]]>0&&TD.byOutfit[cult.eq[k]])?TD.byOutfit[cult.eq[k]].def:0),0);
function itemSize(n){
  if(n==='lt')return 0;if(TD.BAG.sz[n]!=null)return TD.BAG.sz[n];
  const g=TD.byItem[n];if(g)return g.tier;const p=TD.byPearl[n];if(p)return [2,4,8][p.tier-1];
  return 1;
}
function bagUsed(){let s=0;for(const k in loot)if(loot[k]>0)s+=itemSize(k)*loot[k];return s;}
const bagCap=()=>TD.BAG.cap+(cult.bc|0);
const bagFree=()=>bagCap()-bagUsed();

const wAtk=()=>{const w=cult.eq.w&&TD.byWeapon[cult.eq.w];return w&&(loot[cult.eq.w]>0)?w.atk:0;};
function equipToggle(id){
  const o=TD.byOutfit[id];
  if(o&&loot[id]>0){const sk=TD.SLOT[o.part];if(cult.eq[sk]===id){cult.eq[sk]=null;recalc();toast(T('toast.unequip',{name:I18N.itemName(id)}));return true;}cult.eq[sk]=id;recalc();toast(T('toast.equip.o',{name:I18N.itemName(id),def:o.def}));return true;}
  const w=TD.byWeapon[id];if(!w||!(loot[id]>0))return false;
  if(cult.eq.w===id){cult.eq.w=null;recalc();toast(T('toast.unequip',{name:I18N.itemName(id)}));return true;}
  cult.eq.w=id;recalc();toast(T('toast.equip',{name:I18N.itemName(id),atk:Math.round(w.atk*realmMul())}));return true;
}
function drawHeld(t,atking,row,fr){
  const w=cult.eq.w&&TD.byWeapon[cult.eq.w];if(!w||P.dead)return;const f=ITM[w.ico];if(!f||!IMG.it.complete)return;
  const staff=(w.ico==='w10'||w.ico==='w11'||w.ico==='w12');
  if(staff){   /* trượng: cầm xuôi như cũ */
    const sc=.52,pvx=f[2]*.12,pvy=f[3]*.9;let th=-.785+.32;
    if(atking){const u=Math.min(1,(t-P.atkT)/430);th=u<.3?-.785-.55*(u/.3):-.785-.55+(u-.3)/.7*2.6;}
    else if(P.mv)th+=Math.sin(t/95)*.08;
    ctx.save();ctx.translate(8,-13);ctx.rotate(th);ctx.imageSmoothingEnabled=false;ctx.drawImage(IMG.it,f[0],f[1],f[2],f[3],-pvx*sc,-pvy*sc,f[2]*sc,f[3]*sc);ctx.restore();if(cult.eq.o&&IMG.outfit.complete)OF.hand(8,-13,0);return;
  }
  /* kiếm: cán nắm ở góc phải-trên của ảnh, mũi hướng LÊN, lơ lửng cách thân một chút (linh khí giữ thăng bằng); khi đánh thì CHỌC thẳng về phía trước */
  const sc=.56,pvx=f[2]*.84,pvy=f[3]*.16,UP=2.356;
  let th=UP+.10,ox=13,oy=-15+Math.sin(t/380)*.9;
  if(P.mv&&!atking){th+=Math.sin(t/95)*.05;oy+=Math.sin(t/95)*.6;}
  let thr=0;
  if(atking){const u=Math.min(1,(t-P.atkT)/430),ez=x=>x*x*(3-2*x);
    if(u<.3){const k=ez(u/.3);th=UP+.10-.35*k;ox=13-5*k;}                 /* thu kiếm về sau */
    else if(u<.55){const k=ez((u-.3)/.25);th=UP-.25+(3.93-UP+.25)*k;ox=8+11*k;oy+=2*k;thr=k;}   /* chọc tới */
    else if(u<.75){th=3.93;ox=19;oy+=2;thr=1;}
    else{const k=ez((u-.75)/.25);th=3.93-(3.93-UP-.10)*k;ox=19-6*k;oy+=2*(1-k);thr=1-k;}
  }
  ctx.save();ctx.translate(ox,oy);ctx.rotate(th);ctx.imageSmoothingEnabled=false;
  ctx.drawImage(IMG.it,f[0],f[1],f[2],f[3],-pvx*sc,-pvy*sc,f[2]*sc,f[3]*sc);ctx.restore();
  if(cult.eq.o&&IMG.outfit.complete)OF.hand(ox,oy,0);
}

/* ---------- NGỌC: nuốt (trần 10/bậc) · hợp nhất 10 → 1 ---------- */
function pearlInfo(item){
  const p=TD.byPearl[item];if(!p)return null;
  const arr=cult.pl[p.el],t=p.tier,done=arr[t-1];let can=true,reason='';
  if(t>1&&arr[t-2]<TD.PCAP){can=false;reason='lock';}
  else if(done>=TD.PCAP){can=false;reason=t<TD.PT?'cap':'max';}
  return{el:p.el,tier:t,done,cap:TD.PCAP,can,reason,next:t<TD.PT?TD.pearlId(p.el,t+1):null};
}
function swallow(item){
  const i=pearlInfo(item);if(!i||!i.can||!(loot[item]>0))return false;
  lootDec(item);cult.pl[i.el][i.tier-1]++;recalc();lootUI();
  toast(T('toast.swallow',{name:I18N.itemName(item),eff:T('eff.'+i.el)}));return true;
}
function fuse(item){
  const i=pearlInfo(item);if(!i||!i.next||(loot[item]|0)<TD.PFUSE)return false;
  loot[item]-=TD.PFUSE;if(loot[item]<=0)delete loot[item];loot[i.next]=(loot[i.next]|0)+1;lootUI();
  toast(T('toast.fuse',{name:I18N.itemName(i.next)}));return true;
}

const PETS=[],petObjs=[];

function addPet(id){if(PETS.includes(id)||!TD.MONS.some(m=>m.id===id))return false;PETS.push(id);petObjs.push({id,x:P.x-20,y:P.y,f:1,cd:0,run:false});return true;}

function petsUpdate(dt,t){
  const tg=(AUTO.on&&AUTO.tgt&&AUTO.tgt.k==='mon'&&monAlive(AUTO.tgt.ref))?AUTO.tgt.ref:null;
  petObjs.forEach((o,i)=>{
    const off=POFF[i%POFF.length];let tx,ty;
    if(tg){tx=tg.x-(tg.x>=P.x?1:-1)*30;ty=tg.y+(i%2?10:-6);}else{tx=P.x+off[0];ty=P.y+off[1];}
    const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);o.run=d>5;
    if(d>4){const sp=Math.min(d*4,tg?140:100)*dt;o.x+=dx/d*sp;o.y+=dy/d*sp;}
    if(Math.abs(dx)>3)o.f=dx>0?1:-1;
    if(tg&&t>o.cd&&Math.hypot(tg.x-o.x,tg.y-o.y)<60){
      o.cd=t+1100;const dmg=4+Math.floor(STT.dmg/2),el=(TD.MONS.find(m=>m.id===o.id)||{}).el;

function moveMon(m,tx,ty,spd,dt){
  const dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy);if(d<1)return;const s=Math.min(spd*dt,d),nx=m.x+dx/d*s,ny=m.y+dy/d*s;
  if(m.d.fly){m.x=nx;m.y=ny;return;}
  if(!isWater(nx,m.y))m.x=nx;if(!isWater(m.x,ny))m.y=ny;
}
function startSkill(m,i,t){
  const s=m.d.skills[i];m.st='atk';m.sk=s;m.t0=t;m.cd[i]=t+s.cd;m.done=false;m.f=P.x>=m.x?1:-1;m.dashInit=false;
  if(s.k==='aoe'){m.tx=P.x;m.ty=P.y;fx2.push({k:'tele',x:m.tx,y:m.ty,r:s.r,t0:t,dur:s.tele,col:s.col});}
}
function endSkill(m,t){m.st='chase';m.sk=null;m.t0=t;m.hold=t+250;}
function skillStep(m,t,dt){
  const s=m.sk,e=t-m.t0,d=m.d;
  if(s.k==='cone'){const wt=s.wind.length*s.wms,ft=s.fxms.reduce((a,b)=>a+b,0);
    if(!m.done&&e>=wt){m.done=true;fx2.push({k:'cone',id:m.id,mx:m.x+m.f*s.ox*d.sc,my:m.y+s.oy*d.sc,f:m.f,frames:s.fx,fxms:s.fxms,t0:t,dur:ft,len:s.len,hw:s.hw,dmg:s.dmg,hitT:s.hit,hit:false,sc:d.sc});}
    if(e>wt+ft+300)endSkill(m,t);
  }else if(s.k==='proj'){const wt=s.wind.length*s.wms;
    if(!m.done&&e>=wt){m.done=true;const mx=m.x+m.f*s.ox*d.sc,my=m.y+s.oy*d.sc+(d.fly?-16:0),a=Math.atan2(P.y-12-my,P.x-mx);
      projs.push({x:mx,y:my,vx:Math.cos(a)*s.speed,vy:Math.sin(a)*s.speed,t0:t,life:s.life,r:s.r,dmg:s.dmg,frames:s.fx,sc:d.sc,id:m.id});}
    if(e>wt+400)endSkill(m,t);
  }else if(s.k==='aoe'){
    if(!m.done&&e>=s.tele){m.done=true;fx2.push({k:'aoe',id:m.id,x:m.tx,y:m.ty,frames:s.fx,fxms:s.fxms,t0:t,dur:s.fx.length*s.fxms+120,hitT:s.fxms,hit:false,r:s.r,dmg:s.dmg,sc:d.sc});}
    if(e>s.tele+s.fx.length*s.fxms+300)endSkill(m,t);
  }else if(s.k==='charge'){const wt=s.wind.length*s.wms,dtm=s.dist/s.speed*1000;
    if(e>=wt&&e<wt+dtm){
      if(!m.dashInit){m.dashInit=true;const a=Math.atan2(P.y-m.y,P.x-m.x);m.dvx=Math.cos(a);m.dvy=Math.sin(a);m.f=m.dvx>=0?1:-1;m.dhit=false;}
      const nx=m.x+m.dvx*s.speed*dt,ny=m.y+m.dvy*s.speed*dt;if(!isWater(nx,ny)){m.x=nx;m.y=ny;}
      if(!m.dhit&&!P.dead&&Math.hypot(P.x-m.x,P.y-m.y)<30){m.dhit=true;hurtPlayer(s.dmg,m.x,m.y);}
    }else if(e>=wt+dtm+300)endSkill(m,t);
  }
}
function stepMon(m,dt,t){
  const d=m.d;m.flash=Math.max(0,m.flash-dt);
  if(m.st==='dead'){if(t-m.deadAt>MON_RESPAWN){m.hp=m.maxHp;m.x=m.hx;m.y=m.hy;m.st='idle';m.t0=t;m.hold=t+600;}return;}
  if(m.st==='die'){if(t-m.t0>m.dieMs){m.st='dead';m.deadAt=t;}return;}
  const pd=Math.hypot(P.x-m.x,P.y-m.y),hd=Math.hypot(m.hx-m.x,m.hy-m.y);
  switch(m.st){
   case'idle':
     if(m.hp<m.maxHp)m.hp=Math.min(m.maxHp,m.hp+dt*m.maxHp*.05);
     if(!P.dead&&pd<d.aggro&&t>m.hold){m.st='chase';m.t0=t;}
     break;
   case'chase':{

function spr1(img,meta,name,x,y,sc,flip,alpha){
  const f=meta[name];if(!f||!img.complete)return;
  ctx.save();ctx.translate(x,y);if(flip<0)ctx.scale(-1,1);if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.drawImage(img,f[0],f[1],f[2],f[3],f[4]*sc,f[5]*sc,f[2]*sc,f[3]*sc);ctx.restore();
}
function monFrame(m,t){
  const d=m.d,e=t-m.t0;
  switch(m.st){
   case'idle':return d.idle[Math.floor(t/130)%d.idle.length];
   case'chase':case'return':return d.walk[Math.floor(t/105)%d.walk.length];
   case'atk':{const s=m.sk;
     if(s.k==='charge'){const wt=s.wind.length*s.wms;return e<wt?s.wind[Math.min(s.wind.length-1,Math.floor(e/s.wms))]:s.dash[Math.floor((e-wt)/s.dms)%s.dash.length];}
     return s.wind[Math.min(s.wind.length-1,Math.floor(e/s.wms))];}
   case'die':return d.die?d.die[Math.min(d.die.length-1,Math.floor(e/260))]:d.idle[0];
  }
  return d.idle[0];
}
function drawMon2(m,t){
  if(m.st==='dead')return;const d=m.d,img=MIMG[m.id],meta=MMETA[m.id],name=monFrame(m,t),hover=d.fly?-16+Math.sin(t/240)*3:0;

  let al=1;if(m.st==='die'){const k=(t-m.t0)/m.dieMs;al=d.die?(k>.7?Math.max(0,1-(k-.7)/.3):1):Math.max(0,1-k);}
  spr1(img,meta,name,m.x,m.y+hover,d.sc,m.f,al);
  if(m.flash>0){ctx.save();ctx.globalCompositeOperation='lighter';spr1(img,meta,name,m.x,m.y+hover,d.sc,m.f,al*.55);ctx.restore();}
  if(m.st!=='die'&&m.hp<m.maxHp){const f=meta[name],bw=34,by=m.y+hover+(f?f[5]*d.sc:-50)-8;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(m.x-bw/2-1,by-1,bw+2,5);ctx.fillStyle=TD.PEARL[d.el].col;ctx.fillRect(m.x-bw/2,by,bw*m.hp/m.maxHp,3);}
}

function mtTick(dt,t){

function mtFrame(t){
  if(dashing(t))return 'dash'+Math.min(3,Math.floor((t-P.dashT)/112));
  if(P.fly)return 'fly'+(Math.floor(t/120)%5);

function mDraw(name,x,y,sc,al){const F=MTM[name];if(!F)return;if(al!==undefined)ctx.globalAlpha=al;ctx.drawImage(IMG.mnt,F[0],F[1],F[2],F[3],x,y,F[2]*PX*sc,F[3]*PX*sc);ctx.globalAlpha=1;}
const MS=1.25;   /* thú cưỡi to ~2,5–3,5 lần nhân vật */
const MT_SEAT_DY=1.5, MT_FRONT=6, MT_CHIN=9;   /* hông lún nhẹ vào đệm yên (px) · phần thú đè lên người bắt đầu từ trước tâm yên (px) */
function mtLift(t){const F=MTM[mtFrame(t)];return F?(F[6]-F[5])*PX*MS-MT_SEAT_DY*PX-(NC.FEET-65)*PX:0;}   /* rider cao hơn mặt đất bao nhiêu (để kiếm khí, tên khớp) */
function drawMounted(t){
  const fm=mtFrame(t),F=MTM[fm];if(!F||!IMG.mnt.complete)return;
  const hv=P.flyH+(P.fly?Math.sin(t/240)*1.2:0),ax=F[4],ay=F[5],gy=F[6];
  ctx.save();ctx.imageSmoothingEnabled=false;

  ctx.fillStyle='rgba(0,0,0,'+(P.fly?.18:.28)+')';ctx.beginPath();ctx.ellipse(P.x,P.y+1,((P.fly?10:13)-hv*.12)*MS,(P.fly?2.2:3)*MS,0,0,7);ctx.fill();
  /* mây theo sau */
  for(const c of MTP){const e=(t-c.t0)/800;mDraw(c.k,c.x-(MTM[c.k][2]*PX*(.6+e*.5))/2,c.y-MTM[c.k][3]*PX*(.6+e*.5)/2,.6+e*.5,Math.max(0,.9*(1-e)));}
  {const m=ctx.getTransform(),X=m.a*P.x+m.e,Y=m.d*(P.y-hv)+m.f;   /* làm tròn về điểm ảnh màn hình → hết sọc/giật khi di chuyển + chém */
    ctx.translate(Math.round(X)/m.a-m.e/m.a,Math.round(Y)/m.d-m.f/m.d);}
  ctx.scale(P.f,1);
  const mx=-ax*PX*MS,my=-gy*PX*MS,seatY=-(gy-ay)*PX*MS+MT_SEAT_DY*PX;
  mDraw(fm,mx,my,MS);
  /* người ngồi: tâm ngang ở giữa yên, vạch yên (hàng 43/44 = y65 trong khung) đặt đúng mặt đệm */
  const atking=t-P.atkT<430;let row,fr;
  if(P.dead){row=NC.rows.hit;fr=1;}else if(atking){row=NC.rows.atk;fr=Math.min(7,Math.floor((t-P.atkT)/430*8));}
  else if(t-P.hurtT<260){row=NC.rows.hit;fr=(t-P.hurtT)<130?0:1;}else{row=NC.rows.idle;fr=ncIdle(t);}
  ctx.save();ctx.translate(0,seatY+(NC.FEET-65)*PX);
  const sw=NC.W,sh=NC.H,sx=fr*sw,sy=row*sh,CUT=65,LX=34,RX=39;   /* bỏ chân phải ảnh (cột 21-25 = x34..38) */
  const ofx=OF.on()&&IMG.outfit.complete;

  ctx.drawImage(IMG.player,sx,sy+CUT,LX,sh-CUT,-NC.CX*PX,(CUT-NC.FEET)*PX,LX*PX,(sh-CUT)*PX);
  ctx.drawImage(IMG.player,sx+RX,sy+CUT,sw-RX,sh-CUT,(RX-NC.CX)*PX,(CUT-NC.FEET)*PX,(sw-RX)*PX,(sh-CUT)*PX);
  if(ofx)OF.boots({boots:'left'});
  drawHeld(t,atking,row,fr);ctx.restore();
  /* từ trước yên đến đầu: thú đè lên người */
  ctx.save();ctx.beginPath();ctx.rect(MT_FRONT*PX,seatY-(MT_CHIN)*PX,800,800);ctx.clip();mDraw(fm,mx,my,MS);ctx.restore();   /* mặt người (trên cằm) không bị bờm che */
  ctx.restore();
  /* hiệu ứng lên/xuống thú, bắt đầu/ngừng bay */
  const e=t-P.mtFx;
  if(e<750){const k=P.mtFxK;ctx.save();ctx.imageSmoothingEnabled=false;
    const u=e/750,ring=MTM.ring,rs=.5+u*1.1;
    mDraw('ring',P.x-ring[2]*PX*rs/2,P.y-ring[3]*PX*rs*.5-1,rs,Math.max(0,1-u));
    if(k==='up'||k==='fly'){const s=MTM.spark;mDraw('spark',P.x-s[2]*PX/2,P.y-hv-34*PX-u*12,1,Math.max(0,1-u*1.2));}
    if(k==='down'||k==='land'){const s=MTM.spike;mDraw('spike',P.x-s[2]*PX/2,P.y-s[3]*PX+2,1,Math.max(0,1-u*1.3));}
    ctx.restore();}
  ctx.restore();
  drawTag(t,mtLift(t));
}

/* ---------- CẬP NHẬT ---------- */
function update(dt){
  VT+=dt*1000;const t=now();
  // người chơi
  if(P.dead){if(t-P.dead>2200){P.dead=0;P.hp=P.maxHp;P.x=SPAWN.x*TILE+8;P.y=SPAWN.y*TILE+10;P.inv=1.5;}}
  else{
    let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.dx,iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.dy;
    if(AUTO.on&&Math.hypot(ix,iy)<.12){const a=autoThink(t);ix=a.x;iy=a.y;}
    if(dashing(t)&&Math.hypot(ix,iy)<.12){ix=P.f;iy=0;}   /* lướt: không giữ cần thì lướt theo hướng đang nhìn */
    const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
    const atking=t-P.atkT<430;const sp=P.spd*(atking?(P.mt?.6:.35):1)*mtSpeed(t);
    P.mv=m>.12;
    if(P.mv){const k=(!P.fly&&isWater(P.x,P.y+6))?.62:1,nx=P.x+ix*sp*k*dt,ny=P.y+iy*sp*k*dt;P.x=nx;P.y=ny;if(Math.abs(ix)>.2&&!atking)P.f=ix>0?1:-1;}
    if(P.kx||P.ky){P.x+=P.kx*dt;P.y+=P.ky*dt;P.kx*=.86;P.ky*=.86;if(Math.abs(P.kx)<2)P.kx=P.ky=0;}
    {const WW=MW*TILE,HH=MH*TILE;let sx=0,sy=0;if(P.x<0)sx=WW;else if(P.x>=WW)sx=-WW;if(P.y<0)sy=HH;else if(P.y>=HH)sy=-HH;if(sx||sy)onWrap(sx,sy);}   /* thế giới tròn */
    P.inv=Math.max(0,P.inv-dt);
    // đòn đánh: chém tay không, trúng ở khung 5/8
    if(!P.hitDone&&t-P.atkT>=270){P.hitDone=true;
      let hitM=false;
      if(mTargetable()&&M.st!=='die'){const cx=M.x,cy=M.y-18,dx=(cx-P.x)*P.f,dy=cy-(P.y-6);
        if(dx>-10&&Math.hypot(cx-P.x,cy-(P.y-6))<54){mHit(dmgRoll());hitM=true;}}
      if(!hitM)hitM=hitMons2(dmgRoll());
      if(!hitM)harvest(t);
}
    if(!P.fxDone&&t-P.atkT>=140){P.fxDone=true;fxs.push({k:'slash',x:P.x,y:P.y-(P.mt?mtLift(t):0),f:P.f,t0:t,dur:270});}
  }
  // Bạch Khuyển
  {const tx=P.x-P.f*20,ty=P.y+3,dx=tx-dog.x,dy=ty-dog.y,d=Math.hypot(dx,dy);
    if(d>14){const sp=Math.min(d*3.2,92)*dt;dog.x+=dx/d*sp;dog.y+=dy/d*sp;dog.rt=t;}
    dog.run=t-dog.rt<170;if(Math.abs(dx)>6)dog.f=dx>0?1:-1;if(d>260){dog.x=P.x;dog.y=P.y;}}
  mtTick(dt,t);mUpdate(dt);respawnTick(t);
  mon2Update(dt,t);
  qiTick(dt);   /* tu luyện thường: mọi lúc mọi nơi (kể cả khi chết); xem mon2.js */
  // nhặt vật phẩm
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];if(d.exp&&t>d.exp){drops.splice(i,1);continue;}if(t-d.t0>(d.ic?250:500)&&(!d.pa||t>d.pa)&&Math.hypot(P.x-d.x,P.y-d.y)<(d.ic?24:16)){if(bagFree()<itemSize(d.n)){if(t-bagFullT>2500){bagFullT=t;toast(T('toast.bagfull'));}continue;}loot[d.n]=(loot[d.n]||0)+1;drops.splice(i,1);lootUI();toast(T('toast.pick',{name:I18N.itemName(d.n)}));}}
  fxs=fxs.filter(f=>t-f.t0<f.dur);floaters=floaters.filter(f=>t-f.t0<900);
  cam.x+=(P.x-cam.x)*Math.min(1,dt*7);cam.y+=(P.y-18-cam.y)*Math.min(1,dt*7);
}

/* ---------- VẼ ---------- */
function atl(img,fw,fh,cols,i,dx,dy,dw,dh){ctx.drawImage(img,(i%cols)*fw,Math.floor(i/cols)*fh,fw,fh,dx,dy,dw,dh);}
function wadeRipples(x,y,t,w){ // gợn nước quanh chân khi lội
  ctx.save();ctx.strokeStyle='rgba(235,252,255,.7)';ctx.lineWidth=.9;
  for(let k=0;k<2;k++){const u=((t/700)+k*.5)%1;ctx.globalAlpha=(1-u)*.8;ctx.beginPath();ctx.ellipse(x,y+1,w+u*8,(w+u*8)*.32,0,0,7);ctx.stroke();}
  ctx.restore();}
function drawPlayer(t){
  if(P.mt)return drawMounted(t);
  let row,fr;const atking=t-P.atkT<430;
  if(P.dead){row=NC.rows.hit;fr=1;}
  else if(atking){row=NC.rows.atk;fr=Math.min(7,Math.floor((t-P.atkT)/430*8));}
  else if(t-P.hurtT<260){row=NC.rows.hit;fr=(t-P.hurtT)<130?0:1;}
  else if(P.mv){row=NC.rows.walk;fr=Math.floor(t/95)%8;}
  else{row=NC.rows.idle;fr=ncIdle(t);}
  const wd=isWater(P.x,P.y+6);
  ctx.save();if(!wd){ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(P.x,P.y+1,8,2.6,0,0,7);ctx.fill();}
  if(wd){ctx.beginPath();ctx.rect(P.x-60,P.y-120,120,120+0);ctx.clip();}
  if(P.dead)ctx.globalAlpha=Math.max(.15,1-(t-P.dead)/2200);
  else if(P.inv>0&&Math.floor(t/70)%2)ctx.globalAlpha=.55;
  ctx.translate(P.x,P.y+(wd?3:0));ctx.scale(P.f,1);
  if(OF.on()&&IMG.outfit.complete){OF.draw(row,fr);OF.boots();}else ctx.drawImage(IMG.player,fr*NC.W,row*NC.H,NC.W,NC.H,-NC.CX*PX,-NC.FEET*PX,NC.W*PX,NC.H*PX);
  drawHeld(t,atking,row,fr);
  ctx.restore();if(wd)wadeRipples(P.x,P.y,t,7);
  drawTag(t,0);
}
/* tên + thanh HP trên đầu nhân vật (vẽ bằng ô vuông pixel) */
function drawTag(t,lift){
  const nm=(window.G&&window.G.pname)||'';const top=P.y-26-lift-(P.flyH||0),x=Math.round(P.x);
  ctx.save();ctx.imageSmoothingEnabled=false;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font='bold 6px system-ui,sans-serif';
  const y=Math.round(top)-5,w=22,hp=Math.max(0,Math.min(1,P.hp/P.maxHp));
  ctx.fillStyle='#14101e';ctx.fillRect(x-w/2-1,y,w+2,4);ctx.fillStyle='#c9a24a';ctx.fillRect(x-w/2-1,y,w+2,.5);ctx.fillRect(x-w/2-1,y+3.5,w+2,.5);ctx.fillRect(x-w/2-1,y,.5,4);ctx.fillRect(x+w/2+.5,y,.5,4);
  ctx.fillStyle='#3a1218';ctx.fillRect(x-w/2,y+.5,w,3);const fw=Math.round(w*hp*2)/2;ctx.fillStyle='#d8353a';ctx.fillRect(x-w/2,y+.5,fw,3);ctx.fillStyle='#ff8a7a';ctx.fillRect(x-w/2,y+.5,fw,1);ctx.fillStyle='#8f1a22';ctx.fillRect(x-w/2,y+2.5,fw,1);
  if(nm){ctx.fillStyle='#07060c';for(const[dx,dy]of[[-.5,0],[.5,0],[0,-.5],[0,.5]])ctx.fillText(nm,x+dx,y-1.5+dy);ctx.fillStyle='#ffe9b0';ctx.fillText(nm,x,y-1.5);}

   CÀI ĐẶT: nút bánh răng pixel (dưới túi, góc trái) → bảng Cài đặt
   - Ngôn ngữ: Tiếng Việt / 繁體中文 / 简体中文 (I18N.set)

   - Muốn thêm mục cài đặt mới: thêm một khối <section> trong html và hàm render tương ứng.
   ============================================================ */
(function(){
'use strict';
var T=function(k,p){return I18N.t(k,p);};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* bánh răng 16x16 vẽ bằng công thức (răng cưa 8 cái, lỗ giữa), viền tối + highlight */
function gear(px){
  var N=16,c=document.createElement('canvas');c.width=c.height=N*px;var x=c.getContext('2d'),f=[],i,j;
  for(j=0;j<N;j++){f[j]=[];for(i=0;i<N;i++){
    var dx=i-7.5,dy=j-7.5,r=Math.sqrt(dx*dx+dy*dy),a=Math.atan2(dy,dx);
    var tooth=Math.cos(a*8)>0.15;
    f[j][i]=(r<=5.3||(r<=7.4&&tooth))&&r>2.3;
  }}
  for(j=0;j<N;j++)for(i=0;i<N;i++){
    if(!f[j][i])continue;
    var edge=!(f[j-1]&&f[j-1][i])||!(f[j+1]&&f[j+1][i])||!f[j][i-1]||!f[j][i+1];
    var hole=false;
    x.fillStyle=edge?'#1c2a38':((i+j<12)?'#ffffff':((i+j>17)?'#9db8cd':'#d6e8f6'));
    x.fillRect(i*px,j*px,px,px);
  }
  c.style.imageRendering='pixelated';return c;
}

var BTN=[['bag',0,'hud.bag'],['map',1,'hud.map'],['quest',2,'hud.quest'],['sect',3,'hud.sect'],['char',5,'hud.char'],['set',6,'hud.set']];

BTN.forEach(function(b){
  var d=document.createElement('div');d.className='mb';d.innerHTML='<canvas width="78" height="74"></canvas><em></em>';$('hMenu').appendChild(d);mb[b[0]]=d;
  d.onclick=function(){act(b[0]);};
});
function drawBtns(){
  if(!BI.complete||!BI.naturalWidth){setTimeout(drawBtns,150);return;}
  BTN.forEach(function(b){var c=mb[b[0]].querySelector('canvas'),x=c.getContext('2d');x.clearRect(0,0,78,74);x.drawImage(BI,b[1]*78,0,78,74,0,0,78,74);});
}
drawBtns();
function labels(){BTN.forEach(function(b){mb[b[0]].querySelector('em').textContent=T(b[2]);});}
function showSoon(){soon.textContent=T('hud.soon');soon.style.display='block';clearTimeout(showSoon.t);showSoon.t=setTimeout(function(){soon.style.display='none';},1400);}
function act(k){
  if(k==='bag'){$('bagBtn').click();}
  else if(k==='set'){$('setBtn').click();}
  else if(k==='char'){window.TTBag&&TTBag.openTab&&TTBag.openTab('S');}
  else if(k==='map'){openMap();}
  else showSoon();
}

/* ----- chân dung: cắt đầu nhân vật từ sprite (khung 76x90, chân y=71, tâm x=34) ----- */
var avDone=false,avKey=null;
function setImg(id,n){$(id).src=UPS(n);}
$('hRg').src='data:image/webp;base64,'+window.UIP.o_av_ring;setImg('hFh','st_hp');setImg('hFq','st_qi');setImg('hUpI','btn_up');
function drawAv(){   /* từ vạch yên (hàng 43) trở lên, canh giữa một chút */
  var im=G.IMG&&G.IMG.player;if(!im||!im.complete||!im.naturalWidth){setTimeout(drawAv,200);return;}
  var c=$('hAv'),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,112,112);
  if(G.OF&&G.OF.on()&&G.IMG.outfit.complete){var tmp=document.createElement('canvas');G.OF.portrait(tmp,6,8,19,58,67);x.imageSmoothingEnabled=true;x.drawImage(tmp,0,0,tmp.width,tmp.height,2,2,108,108);avDone=true;avKey=G.OF.sig();return;}
  avKey='||';x.drawImage(im,14,22,40,43,4,6,104,112);avDone=true;
}
drawAv();
$('hAvB').onclick=function(){window.TTBag&&TTBag.openTab('S');};
$('hUp').onclick=function(){window.TTBag&&TTBag.openTab('R');};

/* ----- tên vùng theo hướng so với điểm xuất phát (vòng) ----- */
function zoneName(){
  var sp=G.SPAWN,px=G.P.x/16,py=G.P.y/16,dx=wd(sp.x,px,MWT),dy=wd(sp.y,py,MWT);
  if(Math.hypot(dx,dy)<18)return T('zone.c');
  var s=Math.round(Math.atan2(dy,dx)/(Math.PI/4));s=((s%8)+8)%8;
  return T('zone.'+['e','se','s','sw','w','nw','n','ne'][s]);
}

/* ----- bản đồ: cache 1 điểm/ô, lặp 3x3 để cuộn vòng ----- */
var COL={0:[90,154,60],1:[201,168,106],2:[138,141,146],3:[160,160,164],4:[184,154,106],5:[63,143,181]};
var cache=null;
function buildCache(){
  var T0=G.tiles;if(!T0||!T0.length)return null;
  var c=document.createElement('canvas');c.width=c.height=MWT*3;var x=c.getContext('2d');
  var one=document.createElement('canvas');one.width=one.height=MWT;var ox=one.getContext('2d'),id=ox.createImageData(MWT,MWT);
  for(var y=0;y<MWT;y++)for(var q=0;q<MWT;q++){var k=COL[T0[y][q]]||COL[0],o=(y*MWT+q)*4;id.data[o]=k[0];id.data[o+1]=k[1];id.data[o+2]=k[2];id.data[o+3]=255;}
  ox.putImageData(id,0,0);
  for(var a=0;a<3;a++)for(var b=0;b<3;b++)x.drawImage(one,a*MWT,b*MWT);
  return {c:c,one:one};
}
var ELC={kim:'#ffe066',moc:'#6fe06b',thuy:'#5ab8ff',hoa:'#ff7a4a',tho:'#d9a85a'};
function monsDots(fn){
  G.mons2.forEach(function(m){if(m.st==='dead'||m.st==='die')return;fn(m.x/16,m.y/16,ELC[m.d.el]||'#fff',3);});
  if(G.M&&G.M.st!=='sub'&&G.M.st!=='dead')fn(G.M.x/16,G.M.y/16,'#9fe8ff',3);
}
function drawMini(){
  if(!cache){cache=buildCache();if(!cache)return;}
  var c=$('hMc'),x=c.getContext('2d'),R=24,tx=Math.floor(G.P.x/16),ty=Math.floor(G.P.y/16);
  x.imageSmoothingEnabled=false;x.drawImage(cache.c,tx+MWT-R,ty+MWT-R,R*2,R*2,0,0,96,96);
  var s=96/(R*2),cx=48,cy=48,px=G.P.x/16,py=G.P.y/16;
  G.nodes.forEach(function(n){if(n.gone)return;var dx=wd(px,n.x/16,MWT),dy=wd(py,n.y/16,MWT);if(Math.abs(dx)<R&&Math.abs(dy)<R){x.fillStyle=ELC[n.g.el];x.globalAlpha=.9;x.fillRect(cx+dx*s-1,cy+dy*s-1,2,2);}});
  x.globalAlpha=1;
  monsDots(function(mx,my,col,r){var dx=wd(px,mx,MWT),dy=wd(py,my,MWT);if(Math.abs(dx)<R&&Math.abs(dy)<R){x.fillStyle='#000';x.fillRect(cx+dx*s-r/2-1,cy+dy*s-r/2-1,r+2,r+2);x.fillStyle=col;x.fillRect(cx+dx*s-r/2,cy+dy*s-r/2,r,r);}});
  x.fillStyle='#000';x.fillRect(cx-3,cy-3,6,6);x.fillStyle='#fff';x.fillRect(cx-2,cy-2,4,4);
}
function openMap(){
  if(!cache)cache=buildCache();if(!cache)return;
  var c=$('bmC'),x=c.getContext('2d'),S=c.width/MWT;x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);
  x.drawImage(cache.one,0,0,c.width,c.height);
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=1;for(var i=1;i<4;i++){x.beginPath();x.moveTo(i*c.width/4,0);x.lineTo(i*c.width/4,c.height);x.moveTo(0,i*c.height/4);x.lineTo(c.width,i*c.height/4);x.stroke();}
  var sp=G.SPAWN;x.fillStyle='#ffe8a8';x.fillRect(sp.x*S-4,sp.y*S-4,8,8);x.strokeStyle='#000';x.strokeRect(sp.x*S-4,sp.y*S-4,8,8);
  monsDots(function(mx,my,col){x.fillStyle='#000';x.fillRect(mx*S-5,my*S-5,10,10);x.fillStyle=col;x.fillRect(mx*S-4,my*S-4,8,8);});
  var px=(G.P.x/16)%MWT*S,py=(G.P.y/16)%MWT*S;x.fillStyle='#000';x.beginPath();x.arc(px,py,7,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(px,py,5,0,7);x.fill();x.fillStyle='#e03030';x.beginPath();x.arc(px,py,2.5,0,7);x.fill();
  $('bmT').textContent=T('hud.mapt')+' · '+zoneName()+' ('+Math.floor(G.P.x/16)+', '+Math.floor(G.P.y/16)+')';$('bmH').textContent=T('hud.maph');
  big.style.display='flex';
}
big.onclick=function(){big.style.display='none';};
$('hMm').onclick=openMap;

/* ----- cập nhật ----- */
function fmt(n){return I18N.lang==='vi'?String(n).replace('.',','):String(n);}
function tick(){
  var on=$('bagBtn')&&$('bagBtn').style.display!=='none';
  hud.style.display=on?'block':'none';if(!on)return;
  var P=G.P,C=G.cult;
  $('hHp').style.width=Math.max(0,P.hp/P.maxHp*100)+'%';$('hHpT').textContent=Math.round(P.hp)+' / '+P.maxHp;
  var qb=$('hQi'),qt=$('hQiT');
  if(!C.aw){qb.style.width='0%';qt.textContent=T('hud.asleep');}
  else if(C.rl>=G.TD.REALM.max){qb.style.width='100%';qt.textContent=T('hud.qi.max',{n:Math.floor(C.qi)});}
  else{var nd=G.realmNeed(C.rl);qb.style.width=Math.min(100,C.qi/nd*100)+'%';qt.textContent=T('hud.qi',{a:Math.floor(C.qi),b:nd});}
  $('hRl').textContent=C.aw?T('realm.n',{n:C.rl}):T('j.asleep');$('hLv').textContent=C.aw?C.rl:'–';
  $('hZn').textContent=zoneName();$('hCo').textContent='('+Math.floor(P.x/16)+', '+Math.floor(P.y/16)+')';
  if(!avDone||avKey!==(G.OF?G.OF.sig():'||'))drawAv();
}
setInterval(tick,120);
setInterval(function(){if(hud.style.display==='block')drawMini();},250);
labels();I18N.on(function(){labels();tick();});
window.TTHud={tick:tick,openMap:openMap};
})();
</script>

   ĐĂNG NHẬP + LƯU TIẾN ĐỘ (Supabase, gọi thẳng REST — không cần thư viện)
