var cur='vi',subs=[],LSK='tt_lang';
function ok(c){for(var i=0;i<LANGS.length;i++)if(LANGS[i].c===c)return true;return false;}
function guess(){
  var s=null;try{s=localStorage.getItem(LSK);}catch(e){}
  if(s&&ok(s))return s;
  var n=((navigator.languages&&navigator.languages[0])||navigator.language||'vi').toLowerCase();
  if(n.indexOf('zh')===0)return (/tw|hk|mo|hant/.test(n))?'zh-Hant':'zh-Hans';
  return 'vi';
}
function t(k,p){
  var s=(D[cur]&&D[cur][k]);if(s==null)s=D.vi[k];if(s==null)return k;
  if(p)s=s.replace(/\{(\w+)\}/g,function(m,a){return p[a]!=null?p[a]:m;});
  return s;
}
function has(k){return D[cur]&&D[cur][k]!=null||D.vi[k]!=null;}
function apply(root){
  root=root||document;var e,i;
  e=root.querySelectorAll('[data-i18n]');for(i=0;i<e.length;i++)e[i].textContent=t(e[i].getAttribute('data-i18n'));
  e=root.querySelectorAll('[data-i18n-html]');for(i=0;i<e.length;i++)e[i].innerHTML=t(e[i].getAttribute('data-i18n-html'));
  e=root.querySelectorAll('[data-i18n-ph]');for(i=0;i<e.length;i++)e[i].setAttribute('placeholder',t(e[i].getAttribute('data-i18n-ph')));
}
function set(c,silent){
  if(!ok(c))return false;
  var changed=c!==cur;cur=c;
  try{localStorage.setItem(LSK,c);}catch(e){}
  for(var i=0;i<LANGS.length;i++)if(LANGS[i].c===c)document.documentElement.lang=LANGS[i].h;
  document.title=t('title');apply();
  if(changed&&!silent)subs.forEach(function(f){try{f(c);}catch(e){}});
  return changed;
}
function fmtTime(s){
  s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,sp=cur==='vi'?' ':'';
  return (h?t('t.h',{n:h})+sp:'')+t('t.m',{n:m})+sp+t('t.s',{n:r});
}
window.I18N={add:function(c,o){for(var k in o)D[c][k]=o[k];},LANGS:LANGS,t:t,has:has,apply:apply,set:set,fmtTime:fmtTime,on:function(f){subs.push(f);},get lang(){return cur;},
  itemName:function(id){var k='item.'+id;return has(k)?t(k):id;},
  itemDesc:function(id){var k='itemdesc.'+id;return has(k)?t(k):t('itemdesc.default');}};
cur=guess();
document.documentElement.lang=cur==='vi'?'vi':cur;
document.title=t('title');
})();

const NC={W:76,H:90,CX:34,FEET:71,rows:{idle:0,walk:1,atk:2,hit:3},idleMs:[1200,350,350,70,110,70]};
function ncIdle(t){const T=NC.idleMs.reduce((a,b)=>a+b,0);let m=t%T;for(let i=0;i<6;i++){if(m<NC.idleMs[i])return i;m-=NC.idleMs[i];}return 0;}

let seed=20261017;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))>>>0;h=Math.imul(h^(h>>>13),1274126177)>>>0;return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function vnoiseP(x,y,px,py){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),m=(a,n)=>((a%n)+n)%n;
  const a=hash(m(xi,px),m(yi,py)),b=hash(m(xi+1,px),m(yi,py)),c=hash(m(xi,px),m(yi+1,py)),d=hash(m(xi+1,px),m(yi+1,py));return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
/* nhiễu tuần hoàn (chu kỳ px,py ô mạng) → địa hình nối liền hai mép bản đồ: thế giới hình xuyến, đi hết một hướng sẽ quay lại */
function fbmP(x,y,px,py){return(vnoiseP(x,y,px,py)*.5+vnoiseP(x*2,y*2,px*2,py*2)*.25+vnoiseP(x*4,y*4,px*4,py*4)*.125+vnoiseP(x*8,y*8,px*8,py*8)*.0625)/.9375;}
function fbm(x,y){return(vnoise(x,y)*.5+vnoise(x*2,y*2)*.25+vnoise(x*4,y*4)*.125+vnoise(x*8,y*8)*.0625)/.9375;}

    let t=G;

    if(fbmP(x*.05+200,y*.05+90,10,10)>.70)t=R;
    tiles[y][x]=t;

  // hồ của Thủy Long
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const dx=(x-LAKE.x)/LAKE.rx,dy=(y-LAKE.y)/(LAKE.ry*(1+.18*Math.sin(x*.7)));if(dx*dx+dy*dy<1+.25*fbm(x*.3,y*.3))tiles[y][x]=W;}
  // sông: từ hồ chảy xuống biển phía tây-nam
  let rx=LAKE.x-3,ry=LAKE.y+LAKE.ry-1;
  for(let i=0;i<260&&rx>10;i++){
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const X=Math.round(rx)+a,Y=Math.round(ry)+b;if(X>0&&Y>0&&X<MW&&Y<MH)tiles[Y][X]=W;}
    rx-=.55+.5*Math.abs(Math.sin(i*.13));ry+=Math.sin(i*.09)*.55+.28;

  for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++){const X=SPAWN.x+x,Y=SPAWN.y+y;tiles[Y][X]=(Math.abs(x)>=5||Math.abs(y)>=5)?S:B;}

   Tu vi cần để qua tầng n = base·2^(n-1) (gấp đôi mỗi tầng). Mỗi lần đột phá, máu & sát thương nhân thêm ×1,2 (cộng dồn).
   Tu luyện thường chậm (REALM.rate + Thủy châu); thảo dược thô không cho tu vi — phải luyện thành đan (đan phương). */
const realmNeed=l=>l>=TD.REALM.max?Infinity:TD.REALM.base*Math.pow(2,l-1);
const realmMul=l=>Math.pow(TD.REALM.mul,(l||cult.rl)-1);
const qiRate=()=>TD.REALM.rate+STT.qi;
function qiTick(dt){
  if(!cult.dpg&&!(loot['dp.tukhi']>0)){loot['dp.tukhi']=1;cult.dpg=true;lootUI();}   /* tặng đan phương đầu tiên (1 lần) */
  if(!cult.aw||cult.rl>=TD.REALM.max)return;const nd=realmNeed(cult.rl);if(cult.qi<nd)cult.qi=Math.min(nd,cult.qi+dt*qiRate());
}
function breakthrough(){
  if(!cult.aw||cult.rl>=TD.REALM.max||cult.qi<realmNeed(cult.rl)){toast(T('toast.nobreak'));return false;}
  cult.qi-=realmNeed(cult.rl);cult.rl++;recalc();P.hp=P.maxHp;
  toast(T('toast.break',{n:cult.rl,m:(Math.round(TD.REALM.mul*100)/100).toString().replace('.',',')}));return true;
}
function eatDan(n){
  const d=TD.DAN[n];if(!d||!(loot[n]>0))return false;
  if(!cult.aw){toast(T('toast.dan.asleep'));return false;}
  if(cult.rl>=TD.REALM.max){toast(T('toast.dan.max'));return false;}
  if(cult.qi>=realmNeed(cult.rl)){toast(T('toast.dan.full'));return false;}
  lootDec(n);cult.qi+=d.qi;lootUI();toast(T('toast.dan',{name:I18N.itemName(n),n:d.qi}));return true;
}
const matKeys=(el,t)=>TD.RES.filter(g=>g.el===el&&(g.kind==='ore'||g.kind==='tree')&&g.tier>=t).map(g=>g.item);
const ingKeys=k=>k==='@herb1'?TD.RES.filter(g=>g.kind==='herb'&&g.tier===1).map(g=>g.item):k.indexOf('@mat:')===0?matKeys(k.split(':')[1],+k.split(':')[2]):[k];
const ingHave=k=>ingKeys(k).reduce((a,x)=>a+(loot[x]|0),0);
function ingTake(k,q){for(const x of ingKeys(k).sort((a,b)=>(loot[b]|0)-(loot[a]|0))){const t=Math.min(q,loot[x]|0);if(t>0){loot[x]-=t;q-=t;if(loot[x]<=0)delete loot[x];}if(q<=0)break;}}
const recipeOf=(rid,idx)=>{const R=TD.RECIPES[rid];return R&&R.list[idx||0];};
function craftMax(rid,idx){const r=recipeOf(rid,idx);if(!r)return 0;return Math.min(...r.ing.map(([k,q])=>Math.floor(ingHave(k)/q)));}
function craft(rid,n,idx){
  const r=recipeOf(rid,idx);if(!r||!(loot[rid]>0))return 0;n=Math.min(n||1,craftMax(rid,idx));
  if(n<1){toast(T('toast.alc.no'));return 0;}
  r.ing.forEach(([k,q])=>ingTake(k,q*n));
  loot[r.out]=(loot[r.out]|0)+n;lootUI();toast(T('toast.alc',{name:I18N.itemName(r.out),n}));return n;
}

function recalc(){
  const sum=el=>cult.pl[el].reduce((a,b)=>a+b,0),pe=TD.PEARL,rd=x=>Math.round(x*1000)/1000;
  STT.dmg=rd(sum('kim')*pe.kim.per);STT.hp=rd(sum('moc')*pe.moc.per);STT.red=Math.min(.6,rd(sum('tho')*pe.tho.per));STT.spd=rd(sum('hoa')*pe.hoa.per);STT.qi=rd(sum('thuy')*pe.thuy.per);
  if(cult.qi>realmNeed(cult.rl)+TD.DAN['dan.tukhi'].qi)cult.qi=realmNeed(cult.rl);
  const mx=Math.round((100+STT.hp)*realmMul()),old=P.maxHp;P.maxHp=mx;P.hp=mx>old?Math.min(mx,P.hp+(mx-old)):Math.min(P.hp,mx);
}

function pearlInfo(item){
  const p=TD.byPearl[item];if(!p)return null;
  const arr=cult.pl[p.el],t=p.tier,done=arr[t-1];let can=true,reason='';
  if(t>1&&arr[t-2]<TD.PCAP){can=false;reason='lock';}
  else if(done>=TD.PCAP){can=false;reason=t<TD.PT?'cap':'max';}
  return{el:p.el,tier:t,done,cap:TD.PCAP,can,reason,next:t<TD.PT?TD.pearlId(p.el,t+1):null};
}
function swallow(item){
  const i=pearlInfo(item);if(!i||!i.can||!(loot[item]>0))return false;
  lootDec(item);cult.pl[i.el][i.tier-1]++;recalc();lootUI();
  toast(T('toast.swallow',{name:I18N.itemName(item),eff:T('eff.'+i.el)}));return true;
}
function fuse(item){
  const i=pearlInfo(item);if(!i||!i.next||(loot[item]|0)<TD.PFUSE)return false;
  loot[item]-=TD.PFUSE;if(loot[item]<=0)delete loot[item];loot[i.next]=(loot[i.next]|0)+1;lootUI();
  toast(T('toast.fuse',{name:I18N.itemName(i.next)}));return true;
}

const PETS=[],petObjs=[];

function addPet(id){if(PETS.includes(id)||!TD.MONS.some(m=>m.id===id))return false;PETS.push(id);petObjs.push({id,x:P.x-20,y:P.y,f:1,cd:0,run:false});return true;}

  petObjs.forEach((o,i)=>{

    const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);o.run=d>5;

function moveMon(m,tx,ty,spd,dt){
  const dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy);if(d<1)return;const s=Math.min(spd*dt,d),nx=m.x+dx/d*s,ny=m.y+dy/d*s;
  if(m.d.fly){m.x=nx;m.y=ny;return;}
  if(!isWater(nx,m.y))m.x=nx;if(!isWater(m.x,ny))m.y=ny;
}
function startSkill(m,i,t){
  const s=m.d.skills[i];m.st='atk';m.sk=s;m.t0=t;m.cd[i]=t+s.cd;m.done=false;m.f=P.x>=m.x?1:-1;m.dashInit=false;
  if(s.k==='aoe'){m.tx=P.x;m.ty=P.y;fx2.push({k:'tele',x:m.tx,y:m.ty,r:s.r,t0:t,dur:s.tele,col:s.col});}
}
function endSkill(m,t){m.st='chase';m.sk=null;m.t0=t;m.hold=t+250;}
function skillStep(m,t,dt){
  const s=m.sk,e=t-m.t0,d=m.d;
  if(s.k==='cone'){const wt=s.wind.length*s.wms,ft=s.fxms.reduce((a,b)=>a+b,0);
    if(!m.done&&e>=wt){m.done=true;fx2.push({k:'cone',id:m.id,mx:m.x+m.f*s.ox*d.sc,my:m.y+s.oy*d.sc,f:m.f,frames:s.fx,fxms:s.fxms,t0:t,dur:ft,len:s.len,hw:s.hw,dmg:s.dmg,hitT:s.hit,hit:false,sc:d.sc});}
    if(e>wt+ft+300)endSkill(m,t);
  }else if(s.k==='proj'){const wt=s.wind.length*s.wms;
    if(!m.done&&e>=wt){m.done=true;const mx=m.x+m.f*s.ox*d.sc,my=m.y+s.oy*d.sc+(d.fly?-16:0),a=Math.atan2(P.y-12-my,P.x-mx);
      projs.push({x:mx,y:my,vx:Math.cos(a)*s.speed,vy:Math.sin(a)*s.speed,t0:t,life:s.life,r:s.r,dmg:s.dmg,frames:s.fx,sc:d.sc,id:m.id});}
    if(e>wt+400)endSkill(m,t);
  }else if(s.k==='aoe'){
    if(!m.done&&e>=s.tele){m.done=true;fx2.push({k:'aoe',id:m.id,x:m.tx,y:m.ty,frames:s.fx,fxms:s.fxms,t0:t,dur:s.fx.length*s.fxms+120,hitT:s.fxms,hit:false,r:s.r,dmg:s.dmg,sc:d.sc});}
    if(e>s.tele+s.fx.length*s.fxms+300)endSkill(m,t);
  }else if(s.k==='charge'){const wt=s.wind.length*s.wms,dtm=s.dist/s.speed*1000;
    if(e>=wt&&e<wt+dtm){
      if(!m.dashInit){m.dashInit=true;const a=Math.atan2(P.y-m.y,P.x-m.x);m.dvx=Math.cos(a);m.dvy=Math.sin(a);m.f=m.dvx>=0?1:-1;m.dhit=false;}
      const nx=m.x+m.dvx*s.speed*dt,ny=m.y+m.dvy*s.speed*dt;if(!isWater(nx,ny)){m.x=nx;m.y=ny;}
      if(!m.dhit&&!P.dead&&Math.hypot(P.x-m.x,P.y-m.y)<30){m.dhit=true;hurtPlayer(s.dmg,m.x,m.y);}
    }else if(e>=wt+dtm+300)endSkill(m,t);
  }
}
function stepMon(m,dt,t){
  const d=m.d;m.flash=Math.max(0,m.flash-dt);
  if(m.st==='dead'){if(t-m.deadAt>MON_RESPAWN){m.hp=m.maxHp;m.x=m.hx;m.y=m.hy;m.st='idle';m.t0=t;m.hold=t+600;}return;}
  if(m.st==='die'){if(t-m.t0>m.dieMs){m.st='dead';m.deadAt=t;}return;}
  const pd=Math.hypot(P.x-m.x,P.y-m.y),hd=Math.hypot(m.hx-m.x,m.hy-m.y);
  switch(m.st){
   case'idle':
     if(m.hp<m.maxHp)m.hp=Math.min(m.maxHp,m.hp+dt*m.maxHp*.05);
     if(!P.dead&&pd<d.aggro&&t>m.hold){m.st='chase';m.t0=t;}
     break;
   case'chase':{
     if(P.dead||hd>d.leash){m.st='return';m.t0=t;break;}
     m.f=P.x>=m.x?1:-1;
     if(t>=m.hold){const a=d.skills[0],b=d.skills[1],ra=t>=m.cd[0]&&pd<a.range,rb=t>=m.cd[1]&&pd<b.range;
       if(ra||rb){startSkill(m,(ra&&rb)?(Math.random()<.45?1:0):(rb?1:0),t);break;}}
     if(pd>58)moveMon(m,P.x,P.y,d.spd,dt);
     break;}
   case'return':
     moveMon(m,m.hx,m.hy,d.spd*1.5,dt);m.hp=Math.min(m.maxHp,m.hp+dt*m.maxHp*.2);
     if(hd<6){m.st='idle';m.t0=t;m.hold=t+400;}
     break;
   case'atk':skillStep(m,t,dt);break;
  }
}
function monHit(m,dmg){
  if(m===M){mHit(dmg);return;}
  if(!monAlive(m))return;const t=now();
  m.hp=Math.max(0,m.hp-dmg);m.flash=.12;floaters.push({x:m.x,y:m.y-m.d.sc*38,t0:t,s:String(dmg),c:'#fff'});
  if(m.st==='idle'||m.st==='return'){m.st='chase';m.t0=t;m.hold=t;}
  if(m.hp<=0){
    stats.kills++;m.st='die';m.t0=t;m.sk=null;m.dieMs=m.d.die?m.d.die.length*260+500:1000;
    const pid=pearlOf(m.d.el);drops.push({x:m.x,y:m.y-8,t0:t,n:pid});
    toast(T('toast.pearl',{name:I18N.itemName(pid)}));tameRoll(m.id);
  }
}
function hitMons2(dmg){

  for(const m of mons2){if(!monAlive(m))continue;const dx=(m.x-P.x)*P.f,d=Math.hypot(m.x-P.x,m.y-14-(P.y-6));if(dx>-10&&d<54+m.d.sc*8&&d<bd){best=m;bd=d;}}

}
function mon2Update(dt,t){

function spr1(img,meta,name,x,y,sc,flip,alpha){
  const f=meta[name];if(!f||!img.complete)return;
  ctx.save();ctx.translate(x,y);if(flip<0)ctx.scale(-1,1);if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.drawImage(img,f[0],f[1],f[2],f[3],f[4]*sc,f[5]*sc,f[2]*sc,f[3]*sc);ctx.restore();
}
function monFrame(m,t){
  const d=m.d,e=t-m.t0;
  switch(m.st){
   case'idle':return d.idle[Math.floor(t/130)%d.idle.length];
   case'chase':case'return':return d.walk[Math.floor(t/105)%d.walk.length];
   case'atk':{const s=m.sk;
     if(s.k==='charge'){const wt=s.wind.length*s.wms;return e<wt?s.wind[Math.min(s.wind.length-1,Math.floor(e/s.wms))]:s.dash[Math.floor((e-wt)/s.dms)%s.dash.length];}
     return s.wind[Math.min(s.wind.length-1,Math.floor(e/s.wms))];}
   case'die':return d.die?d.die[Math.min(d.die.length-1,Math.floor(e/260))]:d.idle[0];
  }
  return d.idle[0];
}
function drawMon2(m,t){
  if(m.st==='dead')return;const d=m.d,img=MIMG[m.id],meta=MMETA[m.id],name=monFrame(m,t),hover=d.fly?-16+Math.sin(t/240)*3:0;

  let al=1;if(m.st==='die'){const k=(t-m.t0)/m.dieMs;al=d.die?(k>.7?Math.max(0,1-(k-.7)/.3):1):Math.max(0,1-k);}
  spr1(img,meta,name,m.x,m.y+hover,d.sc,m.f,al);
  if(m.flash>0){ctx.save();ctx.globalCompositeOperation='lighter';spr1(img,meta,name,m.x,m.y+hover,d.sc,m.f,al*.55);ctx.restore();}
  if(m.st!=='die'&&m.hp<m.maxHp){const f=meta[name],bw=34,by=m.y+hover+(f?f[5]*d.sc:-50)-8;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(m.x-bw/2-1,by-1,bw+2,5);ctx.fillStyle=TD.PEARL[d.el].col;ctx.fillRect(m.x-bw/2,by,bw*m.hp/m.maxHp,3);}

addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=1;if(e.key===' '||e.key.toLowerCase()==='j'){attack();e.preventDefault();}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
const atkBtn=document.getElementById('atk');
atkBtn.addEventListener('pointerdown',e=>{atkBtn.classList.add('on');attack();e.preventDefault();e.stopPropagation();});
['pointerup','pointercancel','pointerleave'].forEach(n=>atkBtn.addEventListener(n,()=>atkBtn.classList.remove('on')));
const joyEl=document.getElementById('joy'),knob=joyEl.firstElementChild;
cv.addEventListener('pointerdown',e=>{if(joy.on)return;joy.on=true;joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.dx=joy.dy=0;
  joyEl.style.display='block';joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';knob.style.transform='translate(0,0)';try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),R=46;if(d>R){dx*=R/d;dy*=R/d;}
  joy.dx=dx/R;joy.dy=dy/R;knob.style.transform='translate('+dx+'px,'+dy+'px)';e.preventDefault();});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy.on=false;joy.dx=joy.dy=0;joyEl.style.display='none';};
cv.addEventListener('pointerup',joyEnd);cv.addEventListener('pointercancel',joyEnd);
['gesturestart','gesturechange','gestureend','contextmenu'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));

/* ---------- CẬP NHẬT ---------- */
function update(dt){
  VT+=dt*1000;const t=now();
  // người chơi
  if(P.dead){if(t-P.dead>2200){P.dead=0;P.hp=P.maxHp;P.x=SPAWN.x*TILE+8;P.y=SPAWN.y*TILE+10;P.inv=1.5;}}
  else{
    let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.dx,iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.dy;
    if(AUTO.on&&Math.hypot(ix,iy)<.12){const a=autoThink(t);ix=a.x;iy=a.y;}
    if(dashing(t)&&Math.hypot(ix,iy)<.12){ix=P.f;iy=0;}   /* lướt: không giữ cần thì lướt theo hướng đang nhìn */
    const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
    const atking=t-P.atkT<430;const sp=P.spd*(atking?(P.mt?.6:.35):1)*mtSpeed(t);
    P.mv=m>.12;
    if(P.mv){const k=(!P.fly&&isWater(P.x,P.y+6))?.62:1,nx=P.x+ix*sp*k*dt,ny=P.y+iy*sp*k*dt;P.x=nx;P.y=ny;if(Math.abs(ix)>.2&&!atking)P.f=ix>0?1:-1;}
    if(P.kx||P.ky){P.x+=P.kx*dt;P.y+=P.ky*dt;P.kx*=.86;P.ky*=.86;if(Math.abs(P.kx)<2)P.kx=P.ky=0;}
    {const WW=MW*TILE,HH=MH*TILE;let sx=0,sy=0;if(P.x<0)sx=WW;else if(P.x>=WW)sx=-WW;if(P.y<0)sy=HH;else if(P.y>=HH)sy=-HH;if(sx||sy)onWrap(sx,sy);}   /* thế giới tròn */
    P.inv=Math.max(0,P.inv-dt);
    // đòn đánh: chém tay không, trúng ở khung 5/8
    if(!P.hitDone&&t-P.atkT>=270){P.hitDone=true;
      let hitM=false;
      if(mTargetable()&&M.st!=='die'){const cx=M.x,cy=M.y-18,dx=(cx-P.x)*P.f,dy=cy-(P.y-6);
        if(dx>-10&&Math.hypot(cx-P.x,cy-(P.y-6))<54){mHit(dmgRoll());hitM=true;}}
      if(!hitM)hitM=hitMons2(dmgRoll());
      if(!hitM)harvest(t);
}
    if(!P.fxDone&&t-P.atkT>=140){P.fxDone=true;fxs.push({k:'slash',x:P.x,y:P.y,f:P.f,t0:t,dur:270});}
  }
  // Bạch Khuyển
  {const tx=P.x-P.f*20,ty=P.y+3,dx=tx-dog.x,dy=ty-dog.y,d=Math.hypot(dx,dy);
    if(d>14){const sp=Math.min(d*3.2,92)*dt;dog.x+=dx/d*sp;dog.y+=dy/d*sp;dog.rt=t;}
    dog.run=t-dog.rt<170;if(Math.abs(dx)>6)dog.f=dx>0?1:-1;if(d>260){dog.x=P.x;dog.y=P.y;}}
  mtTick(dt,t);mUpdate(dt);respawnTick(t);
  mon2Update(dt,t);
  qiTick(dt);   /* tu luyện thường: mọi lúc mọi nơi (kể cả khi chết); xem mon2.js */
  // nhặt vật phẩm
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];if(d.exp&&t>d.exp){drops.splice(i,1);continue;}if(t-d.t0>(d.ic?250:500)&&(!d.pa||t>d.pa)&&Math.hypot(P.x-d.x,P.y-d.y)<(d.ic?24:16)){if(bagFree()<itemSize(d.n)){if(t-bagFullT>2500){bagFullT=t;toast(T('toast.bagfull'));}continue;}loot[d.n]=(loot[d.n]||0)+1;drops.splice(i,1);lootUI();toast(T('toast.pick',{name:I18N.itemName(d.n)}));}}
  fxs=fxs.filter(f=>t-f.t0<f.dur);floaters=floaters.filter(f=>t-f.t0<900);
  cam.x+=(P.x-cam.x)*Math.min(1,dt*7);cam.y+=(P.y-18-cam.y)*Math.min(1,dt*7);
}

/* ---------- VẼ ---------- */
function atl(img,fw,fh,cols,i,dx,dy,dw,dh){ctx.drawImage(img,(i%cols)*fw,Math.floor(i/cols)*fh,fw,fh,dx,dy,dw,dh);}
function wadeRipples(x,y,t,w){ // gợn nước quanh chân khi lội
  ctx.save();ctx.strokeStyle='rgba(235,252,255,.7)';ctx.lineWidth=.9;
  for(let k=0;k<2;k++){const u=((t/700)+k*.5)%1;ctx.globalAlpha=(1-u)*.8;ctx.beginPath();ctx.ellipse(x,y+1,w+u*8,(w+u*8)*.32,0,0,7);ctx.stroke();}
  ctx.restore();}
function drawPlayer(t){
  if(P.mt)return drawMounted(t);
  let row,fr;const atking=t-P.atkT<430;
  if(P.dead){row=NC.rows.hit;fr=1;}
  else if(atking){row=NC.rows.atk;fr=Math.min(7,Math.floor((t-P.atkT)/430*8));}
  else if(t-P.hurtT<260){row=NC.rows.hit;fr=(t-P.hurtT)<130?0:1;}
  else if(P.mv){row=NC.rows.walk;fr=Math.floor(t/95)%8;}
  else{row=NC.rows.idle;fr=ncIdle(t);}
  const wd=isWater(P.x,P.y+6);
  ctx.save();if(!wd){ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(P.x,P.y+1,8,2.6,0,0,7);ctx.fill();}
  if(wd){ctx.beginPath();ctx.rect(P.x-60,P.y-120,120,120+0);ctx.clip();}
  if(P.dead)ctx.globalAlpha=Math.max(.15,1-(t-P.dead)/2200);
  else if(P.inv>0&&Math.floor(t/70)%2)ctx.globalAlpha=.55;
  ctx.translate(P.x,P.y+(wd?3:0));ctx.scale(P.f,1);
  ctx.drawImage(IMG.player,fr*NC.W,row*NC.H,NC.W,NC.H,-NC.CX*PX,-NC.FEET*PX,NC.W*PX,NC.H*PX);
  drawHeld(t,atking,row,fr);
  ctx.restore();if(wd)wadeRipples(P.x,P.y,t,7);
}
function drawDog(t){
  const f=(dog.run?4:0)+(Math.floor(t/(dog.run?95:260))%4),b=dog.run?Math.abs(Math.sin(t/72*Math.PI/2))*.2:Math.sin(t/104)*.1;
  const wd=isWater(dog.x,dog.y+7);
  ctx.save();if(!wd){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(dog.x,dog.y+7,8,2.4,0,0,7);ctx.fill();}else{ctx.beginPath();ctx.rect(dog.x-40,dog.y-60,80,60+4);ctx.clip();}
  ctx.translate(dog.x,dog.y-b+(wd?2.5:0));ctx.scale(dog.f,1);ctx.imageSmoothingEnabled=true;
  ctx.drawImage(IMG.dog,f*64,0,64,59,-13,7-24,26,24);ctx.restore();ctx.imageSmoothingEnabled=false;if(wd)wadeRipples(dog.x,dog.y+7,t,6);
}
function drDraw(name,dx,dy,alpha){const r=DR.idx[name];if(!r)return;if(alpha!==undefined)ctx.globalAlpha=alpha;ctx.drawImage(IMG.dragon,r[0],r[1],r[2],r[3],dx+r[4]*DPX,dy+r[5]*DPX,r[2]*DPX,r[3]*DPX);ctx.globalAlpha=1;}
function mFrame(t){ // trả về {name, sink(0..1), extra}
  const e=t-M.t0;
  switch(M.st){
  case'idle':return{n:'idle'+(Math.floor(t/110)%8)};
  case'swim':return{n:'walk'+(Math.floor(t/95)%8)};
  case'wind':return{n:['atk0','atk1','atk2'][Math.min(2,Math.floor(e/150))]};
  case'fire':return{n:'atk3'};
  case'recover':return{n:'atk5'};
  case'hurt':return{n:e<170?'hurt1':'hurt2'};
  case'surge':{const seq=[['dive2',140],['dive3',120],['dive4',140],['dive5',130],['dive6',100]];let a=0;for(const s of seq){if(e<a+s[1])return{n:s[0]};a+=s[1];}return{n:'idle0'};}
  case'rise':{const p=Math.min(1,e/650);return{n:p<.7?'idle'+(Math.floor(t/110)%8):'idle0',sink:1-easeOut(p),rise:1};}
  case'dive':{const p=Math.min(1,e/720);if(p<.3)return{n:'dive0'};if(p<.45)return{n:'dive1'};return{n:'dive1',sink:easeIn((p-.45)/.55)};}
  case'die':{const seq=[['hurt3',160],['hurt4',200],['hurt5',220],['die0',200],['die1',200],['die2',200],['die3',200],['die4',200],['die5',160],['die6',160]];let a=0;for(const s of seq){if(e<a+s[1])return{n:s[0],al:s[0]==='die6'?1-(e-a)/s[1]:1};a+=s[1];}return{n:'die6',al:0};}
  }
  return null;
}
const easeOut=u=>1-(1-u)*(1-u),easeIn=u=>u*u;
function drawMonster(t){
  if(M.st==='dead')return;
  const fx=mFrame(t);
  // gợn nước dưới chân khi ở trên mặt
  ctx.save();
  if(M.st==='sub'||M.st==='tele'){ctx.restore();return;}
  const wob=Math.sin(t/260)*.6;
  ctx.strokeStyle='rgba(225,250,255,.55)';ctx.lineWidth=.9;
  for(let k=0;k<2;k++){const u=((t/900)+k*.5)%1;ctx.globalAlpha=(1-u)*.7;ctx.beginPath();ctx.ellipse(M.x,M.y-1,12+u*16,3+u*4,0,0,7);ctx.stroke();}
  ctx.globalAlpha=1;
  if(!fx){ctx.restore();return;}
  const sink=fx.sink||0;
  ctx.translate(M.x,M.y);
  // cắt theo mặt nước khi lặn / trồi: sprite trượt xuống và bị che dưới mặt nước
  if(sink>0){ctx.beginPath();ctx.rect(-120,-150,240,150-1);ctx.clip();}
  ctx.scale(M.f,1);
  const shake=(M.st==='hurt')?Math.sin(t/22)*1.2:0;
  ctx.translate(shake,sink*48+(M.st==='idle'?wob*.4:0));
  if(M.flash>0)ctx.filter='brightness(2.2) saturate(.4)';
  // tia nước (vẽ trước thân để miệng đè lên)
  if(M.st==='fire'&&M.beam){const b=M.beam,e=t-M.t0;ctx.save();ctx.translate(-0,0);ctx.restore();}
  drDraw(fx.n,-DR.ax*DPX,-DR.ay*DPX,fx.al);
  ctx.filter='none';
  ctx.restore();
  // tia nước theo hướng đã khoá
  if(M.st==='fire'&&M.beam){const b=M.beam,e=t-M.t0,img=Math.floor(e/70)%2?IMG.beamB:IMG.beamA;
    const g=Math.min(1,e/90),fade=e>380?Math.max(0,1-(e-380)/90):1,len=b.L*g;
    ctx.save();ctx.globalAlpha=fade;ctx.translate(b.mx,b.my);ctx.scale(M.f,1);ctx.rotate(b.ang);
    ctx.drawImage(img,0,0,img.width,img.height,-4,-img.height*DPX/2,Math.max(10,len+4),img.height*DPX);ctx.restore();}
  // báo hiệu vòng nước trước khi nước phun
  if(M.st==='tele'&&M.tele){}
}
function drawWorldFx(t){
  for(const f of fxs){const u=(t-f.t0)/f.dur;
    if(f.k==='ring'){ctx.globalAlpha=(1-u)*.8;ctx.strokeStyle='rgba('+f.col+',1)';ctx.lineWidth=1;const r=f.r0+(f.r1-f.r0)*u;ctx.beginPath();ctx.ellipse(f.x,f.y,r,r*.36,0,0,7);ctx.stroke();}
    else if(f.k==='bub'){ctx.globalAlpha=(1-u)*.85;ctx.strokeStyle='#e8fbff';ctx.lineWidth=.8;const y=f.y+f.vy*u*(f.dur/1000);ctx.beginPath();ctx.arc(f.x+Math.sin(u*9)*1.5,y,f.s,0,7);ctx.stroke();}
    else if(f.k==='spl'){const s=(t-f.t0)/1000;ctx.globalAlpha=1-u;ctx.fillStyle=u<.5?'#e6fbff':'#7fd4ff';ctx.fillRect(f.x+f.vx*s-f.s/2,f.y+f.vy*s+120*s*s-f.s/2,f.s,f.s);}
  }
  ctx.globalAlpha=1;
  // vòng cảnh báo vùng nước sắp phun
  if(M.st==='tele'&&M.tele){const e=t-M.t0,u=Math.min(1,e/900);ctx.strokeStyle='rgba(255,255,255,'+(.4+.4*Math.sin(t/60))+')';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.ellipse(M.tele.x,M.tele.y,34*u,12*u,0,0,7);ctx.stroke();ctx.fillStyle='rgba(120,210,255,.18)';ctx.fill();}
  // phun nước (cột nước trồi lên trước khi rồng nhô ra) — dùng ngay khung geyser của sheet
}
function drawSlash(f,t){ // hiệu ứng chém tay không: vệt cung pixel quét từ trên xuống phía trước
  const u=Math.min(1,(t-f.t0)/f.dur),e=1-(1-u)*(1-u),a1=-2.1+3.0*e,R=26,cx=4,cy=-17;
  ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.f,1);
  for(let i=0;i<34;i++){const k=i/34,a=a1-k*1.7,al=Math.max(0,Math.min(1,(1-k)*1.15)*(1-u*.55));if(al<=0)continue;
    for(let j=-3;j<=3;j++){const r=R+j*1.6,core=Math.abs(j)<=0,mid=Math.abs(j)===1;
      ctx.globalAlpha=al*(core?1:mid?.8:.45);ctx.fillStyle=core?(k<.3?'#ffffff':'#d8f3ff'):mid?'#8fd6ff':'#3d9bff';
      ctx.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r*.85),3,3);}}
  // vài tia lửa nước ở đầu vệt chém
  ctx.globalAlpha=1-u;ctx.fillStyle='#fff';for(let i=0;i<5;i++){const a=a1+.15+i*.2,r=R+4+i*2;ctx.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r*.85),1.6,1.6);}
  ctx.restore();ctx.globalAlpha=1;
}
function drawNode(n,t){const g=n.g;let fi=0;
  if(t-n.shk<240)fi=(Math.floor((t-n.shk)/60)%2)?1:0;
  const f=RMETA[g.id][fi],sc=g.sc;ctx.drawImage(IMG.res,f[0],f[1],f[2],f[3],n.x+f[4]*sc,n.y+f[5]*sc,f[2]*sc,f[3]*sc);}
function drawDrops(t){for(const d of drops){const y=d.y-4+Math.sin(t/260)*2;if(d.exp&&d.exp-t<10000&&Math.floor(t/150)%2)continue;
  const pb=TD.byPearl[d.n],pc=pb?TD.PEARL[pb.el]:{col:'#e8fbff',glow:'#4aa8ff'};
  if(d.ic){const f=RMETA[d.ic][3],sc=.8333,w=f[2]*sc,h=f[3]*sc;ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(d.x,d.y+5,w*.35,2,0,0,7);ctx.fill();ctx.restore();
    ctx.drawImage(IMG.res,f[0],f[1],f[2],f[3],d.x-w/2,y-h+2,w,h);continue;}const g=ctx.createRadialGradient(d.x,y,1,d.x,y,10);g.addColorStop(0,pc.col+'e6');g.addColorStop(1,pc.glow+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(d.x,y,10,0,7);ctx.fill();ctx.fillStyle=pc.col;ctx.fillRect(d.x-2,y-2,4,4);ctx.fillStyle=pc.glow;ctx.fillRect(d.x-2,y+1,4,1);ctx.fillRect(d.x-2,y-2,1,4);}}
function drawWorld(t,hw,hh){
  const tm=t/600;
  const hwx=hw,hhx=hh;
  const x0=Math.max(0,Math.floor((cam.x-hw)/TILE)),x1=Math.min(MW-1,Math.floor((cam.x+hw)/TILE)),y0=Math.max(0,Math.floor((cam.y-hh)/TILE)),y1=Math.min(MH-1,Math.floor((cam.y+hh)/TILE));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)drawTile(tiles[y][x],x,y);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)tileDeco(tiles[y][x],x,y,tm);
  drawWorldFx(t);drawDrops(t);drawAutoRing(t);
  // xếp theo y: quái, người, chó
  const L=[{y:M.y,f:()=>drawMonster(t)},{y:P.y+(P.fly?5000:0),f:()=>drawPlayer(t)},{y:dog.y,f:()=>drawDog(t)}];
  {const rcx=Math.ceil(hw/TILE/4)+1,rcy=Math.ceil(hh/TILE/4)+1,ccx=cam.x/TILE>>2,ccy=cam.y/TILE>>2;
   for(let i=-rcx;i<=rcx;i++)for(let j=-rcy;j<=rcy;j++){const a=nodeCell.get((ccx+i)+','+(ccy+j));if(!a)continue;
    for(const n of a)if(Math.abs(n.x-cam.x)<hw+30&&Math.abs(n.y-cam.y)<hh+30)L.push({y:n.y,f:()=>drawNode(n,t)});}}
  for(const m of mons2)if(m.st!=='dead'&&Math.abs(m.x-cam.x)<hw+90&&Math.abs(m.y-cam.y)<hh+90)L.push({y:m.y,f:()=>drawMon2(m,t)});
  for(const o of petObjs)L.push({y:o.y,f:()=>drawPet(o,t)});
  L.sort((a,b)=>a.y-b.y);
  for(const o of L)o.f();
  drawMonFx(t);
  for(const f of fxs)if(f.k==='slash')drawSlash(f,t);
  // sát thương bay
  ctx.textAlign='center';ctx.font='bold 8px sans-serif';
  for(const f of floaters){const u=(t-f.t0)/900;ctx.globalAlpha=1-u;ctx.fillStyle='#000';ctx.fillText(f.s,f.x+.6,f.y-u*16+.6);ctx.fillStyle=f.c;ctx.fillText(f.s,f.x,f.y-u*16);}
}
function draw(){
  const t=now();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b1620';ctx.fillRect(0,0,cv.width,cv.height);
  if(!texInit()||ready<NEED-0)return;
  const s=ZOOM*DPR;ctx.setTransform(s,0,0,s,Math.round(cv.width/2-cam.x*s),Math.round(cv.height/2-cam.y*s));ctx.imageSmoothingEnabled=false;
  const hw=VW/ZOOM/2+TILE,hh=VH/ZOOM/2+TILE,WW=MW*TILE,HH=MH*TILE,oxs=[0],oys=[0];
  if(cam.x-hw<0)oxs.push(-WW);if(cam.x+hw>WW)oxs.push(WW);if(cam.y-hh<0)oys.push(-HH);if(cam.y+hh>HH)oys.push(HH);
  for(const ox of oxs)for(const oy of oys){ctx.save();ctx.translate(ox,oy);cam.x-=ox;cam.y-=oy;drawWorld(t,hw,hh);cam.x+=ox;cam.y+=oy;ctx.restore();}
  ctx.globalAlpha=1;
  // HUD
  document.querySelector('#hp i').style.width=(P.hp/P.maxHp*100)+'%';
  const show=(M.st!=='sub'&&M.st!=='tele'&&M.st!=='dead'&&M.st!=='die')?1:0;
  document.getElementById('mon').style.opacity=show;document.getElementById('monN').style.opacity=show;
  document.querySelector('#mon i').style.width=(M.hp/M.maxHp*100)+'%';
}
let last=performance.now();

function startFx(){
  var cv=$('bagCv'),x=cv.getContext('2d');
  function fit(){var r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);}
  fit();stars=[];for(var i=0;i<46;i++)stars.push({x:Math.random(),y:Math.random(),s:.4+Math.random()*1.2,v:.012+Math.random()*.03,p:Math.random()*6.28,c:Math.random()<.3?'#ffe58f':'#b9d8ff'});
  var t0=performance.now();
  function f(t){
    var W=cv.width,H=cv.height,k=(t-t0)/1000;x.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){var s=stars[i];s.y-=s.v*.016;if(s.y<-.02)s.y=1.02;
      var a=.35+.45*Math.sin(k*1.6+s.p);x.globalAlpha=Math.max(.05,a);x.fillStyle=s.c;var z=Math.max(1,Math.round(s.s*W/260));x.fillRect(Math.round(s.x*W+Math.sin(k*.5+s.p)*6),Math.round(s.y*H),z,z);}
    x.globalAlpha=1;raf=requestAnimationFrame(f);
  }
  cancelAnimationFrame(raf);raf=requestAnimationFrame(f);
}

<script>/* ============================================================
   CÀI ĐẶT: nút bánh răng pixel (dưới túi, góc trái) → bảng Cài đặt
   - Ngôn ngữ: Tiếng Việt / 繁體中文 / 简体中文 (I18N.set)
   - Tài khoản: tên đăng nhập + Đăng xuất (TT.logout)
   - Muốn thêm mục cài đặt mới: thêm một khối <section> trong html và hàm render tương ứng.
   ============================================================ */
(function(){
'use strict';
var T=function(k,p){return I18N.t(k,p);};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* bánh răng 16x16 vẽ bằng công thức (răng cưa 8 cái, lỗ giữa), viền tối + highlight */
function gear(px){
  var N=16,c=document.createElement('canvas');c.width=c.height=N*px;var x=c.getContext('2d'),f=[],i,j;
  for(j=0;j<N;j++){f[j]=[];for(i=0;i<N;i++){
    var dx=i-7.5,dy=j-7.5,r=Math.sqrt(dx*dx+dy*dy),a=Math.atan2(dy,dx);
    var tooth=Math.cos(a*8)>0.15;
    f[j][i]=(r<=5.3||(r<=7.4&&tooth))&&r>2.3;
  }}
  for(j=0;j<N;j++)for(i=0;i<N;i++){
    if(!f[j][i])continue;
    var edge=!(f[j-1]&&f[j-1][i])||!(f[j+1]&&f[j+1][i])||!f[j][i-1]||!f[j][i+1];
    var hole=false;
    x.fillStyle=edge?'#1c2a38':((i+j<12)?'#ffffff':((i+j>17)?'#9db8cd':'#d6e8f6'));
    x.fillRect(i*px,j*px,px,px);
  }
  c.style.imageRendering='pixelated';return c;
}

'#set .out{margin-top:10px;width:100%;border-color:#a85a5a;color:#ffc0b8;background:#2a1a1e}';
document.head.appendChild(css);

'<h3 data-i18n="set.lang"></h3><div class="langs" id="setL"></div><div class="note" data-i18n="set.langnote"></div>'+
'<h3 data-i18n="set.code"></h3><div class="codeRow"><input id="setCode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="setCodeGo" type="button" data-i18n="set.code.go"></button></div><div class="note" id="setCodeMsg"></div>'+
'<h3 data-i18n="set.account"></h3><div id="setA"></div><div class="note" style="text-align:center;margin-top:14px">v1018.0134</div></div>';
document.body.appendChild(pn);

<script>/* ============================================================

var WW=200*16,MWT=200;

'#hp,#qi,#bagBtn,#setBtn,#hint{display:none!important}'+
'#hud{position:fixed;inset:0;z-index:30;pointer-events:none;display:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}'+

'#hud .pf{position:absolute;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);width:226px;height:64px;pointer-events:auto}'+

/* ----- chân dung: cắt đầu nhân vật từ sprite (khung 76x90, chân y=71, tâm x=34) ----- */
var avDone=false;
function drawAv(){
  var im=G.IMG&&G.IMG.player;if(!im||!im.complete||!im.naturalWidth){setTimeout(drawAv,200);return;}
  var c=$('hAv'),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,64,64);
  x.drawImage(im,34-17,18,34,34,-2,0,68,68);avDone=true;
}

/* ----- tên vùng theo hướng so với điểm xuất phát (vòng) ----- */
function zoneName(){
  var sp=G.SPAWN,px=G.P.x/16,py=G.P.y/16,dx=wd(sp.x,px,MWT),dy=wd(sp.y,py,MWT);
  if(Math.hypot(dx,dy)<18)return T('zone.c');
  var s=Math.round(Math.atan2(dy,dx)/(Math.PI/4));s=((s%8)+8)%8;
  return T('zone.'+['e','se','s','sw','w','nw','n','ne'][s]);
}

/* ----- bản đồ: cache 1 điểm/ô, lặp 3x3 để cuộn vòng ----- */
var COL={0:[90,154,60],1:[201,168,106],2:[138,141,146],3:[160,160,164],4:[184,154,106],5:[63,143,181]};
var cache=null;
function buildCache(){
  var T0=G.tiles;if(!T0||!T0.length)return null;
  var c=document.createElement('canvas');c.width=c.height=MWT*3;var x=c.getContext('2d');
  var one=document.createElement('canvas');one.width=one.height=MWT;var ox=one.getContext('2d'),id=ox.createImageData(MWT,MWT);
  for(var y=0;y<MWT;y++)for(var q=0;q<MWT;q++){var k=COL[T0[y][q]]||COL[0],o=(y*MWT+q)*4;id.data[o]=k[0];id.data[o+1]=k[1];id.data[o+2]=k[2];id.data[o+3]=255;}
  ox.putImageData(id,0,0);
  for(var a=0;a<3;a++)for(var b=0;b<3;b++)x.drawImage(one,a*MWT,b*MWT);
  return {c:c,one:one};
}
var ELC={kim:'#ffe066',moc:'#6fe06b',thuy:'#5ab8ff',hoa:'#ff7a4a',tho:'#d9a85a'};
function monsDots(fn){
  G.mons2.forEach(function(m){if(m.st==='dead'||m.st==='die')return;fn(m.x/16,m.y/16,ELC[m.d.el]||'#fff',3);});
  if(G.M&&G.M.st!=='sub'&&G.M.st!=='dead')fn(G.M.x/16,G.M.y/16,'#9fe8ff',3);
}
function drawMini(){
  if(!cache){cache=buildCache();if(!cache)return;}
  var c=$('hMc'),x=c.getContext('2d'),R=24,tx=Math.floor(G.P.x/16),ty=Math.floor(G.P.y/16);
  x.imageSmoothingEnabled=false;x.drawImage(cache.c,tx+MWT-R,ty+MWT-R,R*2,R*2,0,0,96,96);
  var s=96/(R*2),cx=48,cy=48,px=G.P.x/16,py=G.P.y/16;
  G.nodes.forEach(function(n){if(n.gone)return;var dx=wd(px,n.x/16,MWT),dy=wd(py,n.y/16,MWT);if(Math.abs(dx)<R&&Math.abs(dy)<R){x.fillStyle=ELC[n.g.el];x.globalAlpha=.9;x.fillRect(cx+dx*s-1,cy+dy*s-1,2,2);}});
  x.globalAlpha=1;
  monsDots(function(mx,my,col,r){var dx=wd(px,mx,MWT),dy=wd(py,my,MWT);if(Math.abs(dx)<R&&Math.abs(dy)<R){x.fillStyle='#000';x.fillRect(cx+dx*s-r/2-1,cy+dy*s-r/2-1,r+2,r+2);x.fillStyle=col;x.fillRect(cx+dx*s-r/2,cy+dy*s-r/2,r,r);}});
  x.fillStyle='#000';x.fillRect(cx-3,cy-3,6,6);x.fillStyle='#fff';x.fillRect(cx-2,cy-2,4,4);
}
function openMap(){
  if(!cache)cache=buildCache();if(!cache)return;
  var c=$('bmC'),x=c.getContext('2d'),S=c.width/MWT;x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);
  x.drawImage(cache.one,0,0,c.width,c.height);
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=1;for(var i=1;i<4;i++){x.beginPath();x.moveTo(i*c.width/4,0);x.lineTo(i*c.width/4,c.height);x.moveTo(0,i*c.height/4);x.lineTo(c.width,i*c.height/4);x.stroke();}
  var sp=G.SPAWN;x.fillStyle='#ffe8a8';x.fillRect(sp.x*S-4,sp.y*S-4,8,8);x.strokeStyle='#000';x.strokeRect(sp.x*S-4,sp.y*S-4,8,8);
  monsDots(function(mx,my,col){x.fillStyle='#000';x.fillRect(mx*S-5,my*S-5,10,10);x.fillStyle=col;x.fillRect(mx*S-4,my*S-4,8,8);});
  var px=(G.P.x/16)%MWT*S,py=(G.P.y/16)%MWT*S;x.fillStyle='#000';x.beginPath();x.arc(px,py,7,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(px,py,5,0,7);x.fill();x.fillStyle='#e03030';x.beginPath();x.arc(px,py,2.5,0,7);x.fill();
  $('bmT').textContent=T('hud.mapt')+' · '+zoneName()+' ('+Math.floor(G.P.x/16)+', '+Math.floor(G.P.y/16)+')';$('bmH').textContent=T('hud.maph');
  big.style.display='flex';
}
big.onclick=function(){big.style.display='none';};
$('hMm').onclick=openMap;

/* ----- cập nhật ----- */
function fmt(n){return I18N.lang==='vi'?String(n).replace('.',','):String(n);}
function tick(){
  var on=$('bagBtn')&&$('bagBtn').style.display!=='none';
  hud.style.display=on?'block':'none';if(!on)return;
  var P=G.P,C=G.cult;
  $('hHp').style.width=Math.max(0,P.hp/P.maxHp*100)+'%';$('hHpT').textContent=Math.round(P.hp)+' / '+P.maxHp;
  var qb=$('hQi'),qt=$('hQiT');
  if(!C.aw){qb.style.width='0%';qt.textContent=T('hud.asleep');}
  else if(C.rl>=G.TD.REALM.max){qb.style.width='100%';qt.textContent=T('hud.qi.max',{n:Math.floor(C.qi)});}
  else{var nd=G.realmNeed(C.rl);qb.style.width=Math.min(100,C.qi/nd*100)+'%';qt.textContent=T('hud.qi',{a:Math.floor(C.qi),b:nd});}
  $('hRl').textContent=T('realm.n',{n:C.rl});
  $('hZn').textContent=zoneName();$('hCo').textContent='('+Math.floor(P.x/16)+', '+Math.floor(P.y/16)+')';
  if(!avDone)drawAv();
}
setInterval(tick,120);
setInterval(function(){if(hud.style.display==='block')drawMini();},250);
labels();I18N.on(function(){labels();tick();});
window.TTHud={tick:tick,openMap:openMap};
})();

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
function $(id){return document.getElementById(id);}
function norm(n){return String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().trim();}
function emailOf(name,i){return name+'@'+DOMAINS[i];}

/* ---------- gọi API ---------- */
function req(path,method,body,token,keep,prefer){
  var h={apikey:KEY,'Content-Type':'application/json'};
  if(prefer)h.Prefer=prefer;
  if(token)h.Authorization='Bearer '+token;
  return fetch(URL_+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined,keepalive:!!keep}).then(function(r){
    return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null;}catch(e){}return{ok:r.ok,status:r.status,j:j};});
  });
}
function rawErr(r){var j=r&&r.j||{};return String(j.msg||j.error_description||j.message||j.error||('HTTP '+(r&&r.status)));}
function viErr(r){
  var m=rawErr(r),l=m.toLowerCase(),T=I18N.t;
  if(l.indexOf('invalid login')>=0)return T('err.badlogin');
  if(l.indexOf('already registered')>=0||l.indexOf('already been registered')>=0)return T('err.exists');
  if(l.indexOf('at least')>=0&&l.indexOf('password')>=0)return T('err.pw6');
  if(l.indexOf('signups not allowed')>=0||l.indexOf('signup is disabled')>=0)return T('err.signupoff');
  if(l.indexOf('email logins are disabled')>=0||l.indexOf('provider is not enabled')>=0)return T('err.emailoff');
  if(l.indexOf('rate limit')>=0||r.status===429)return T('err.rate');
  return T('err.server',{m:m});
}
function mkSession(j,name){
  if(!j||!j.access_token)return null;
  return{at:j.access_token,rt:j.refresh_token,exp:j.expires_at?j.expires_at*1000:Date.now()+(j.expires_in||3600)*1000,uid:(j.user&&j.user.id)||'',name:name};
}
function persist(){ls(LSK,S?JSON.stringify(S):null);}

function signIn(name,pw){
  var i=0,last=null;
  function next(){
    if(i>=DOMAINS.length)return Promise.resolve({err:last});
    var k=i++;
    return req('/auth/v1/token?grant_type=password','POST',{email:emailOf(name,k),password:pw}).then(function(r){
      if(r.ok){var s=mkSession(r.j,name);if(s)return{s:s};}
      last=r;
      return next();
    });
  }
  return next();
}
function signUp(name,pw){
  var i=0;
  function next(){
    var k=i++;
    return req('/auth/v1/signup','POST',{email:emailOf(name,k),password:pw}).then(function(r){
      if(r.ok){
        var s=mkSession(r.j,name);
        if(s)return{s:s};
        return{err:r,confirmOn:true};
      }
      var l=rawErr(r).toLowerCase();
      if((l.indexOf('invalid')>=0&&l.indexOf('email')>=0)&&i<DOMAINS.length)return next();
      return{err:r};
    });
  }
  return next();
}
function refresh(){
  if(!S)return Promise.resolve(false);
  return req('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:S.rt}).then(function(r){
    if(r.ok){var s=mkSession(r.j,S.name);if(s){S=s;persist();return true;}}
    if(r.status>=400&&r.status<500){S=null;persist();return false;}
    return null;
  },function(){return null;});
}
function ensure(){
  if(!S)return Promise.resolve(false);
  if(S.exp-60000>Date.now())return Promise.resolve(true);
  return refresh();
}

/* ---------- dữ liệu save ---------- */
function collect(){
  var P=G.P,l={};for(var k in G.loot)l[k]=G.loot[k];
  var st=G.stats;return{v:SAVE_V,x:+P.x.toFixed(1),y:+P.y.toFixed(1),f:P.f,hp:Math.round(P.hp),loot:l,stats:{kills:st.kills|0,steps:Math.round(st.steps),sec:Math.round(st.sec)},set:{lang:I18N.lang},cul:{r:{kim:G.cult.r.kim|0,moc:G.cult.r.moc|0,thuy:G.cult.r.thuy|0,hoa:G.cult.r.hoa|0,tho:G.cult.r.tho|0},pl:plCopy(),aw:G.cult.aw?1:0,qi:+G.cult.qi.toFixed(1),rl:G.cult.rl|0,dpg:G.cult.dpg?1:0,eq:G.cult.eq.w||'',bc:G.cult.bc|0,codes:G.cult.codes|0},pets:G.PETS.slice()};
}
function plCopy(){var o={};['kim','moc','thuy','hoa','tho'].forEach(function(e){o[e]=G.cult.pl[e].map(function(x){return x|0;});});return o;}
function migrate(d){/* d.v cũ → mới. Hiện mới có v=1 nên chưa cần. */return d;}
function apply(d){
  if(!d||typeof d!=='object')return;
  d=migrate(d);var P=G.P;
  if(isFinite(d.x)&&isFinite(d.y)){P.x=d.x;P.y=d.y;G.cam.x=P.x;G.cam.y=P.y;G.dog.x=P.x-18;G.dog.y=P.y+4;}
  if(d.f===1||d.f===-1)P.f=d.f;
  {var cc=G.cult,u=(d.cul&&typeof d.cul==='object')?d.cul:{},ur=u.r||{},up=u.pl||{};
   ['kim','moc','thuy','hoa','tho'].forEach(function(e){cc.r[e]=Math.max(0,Math.min(100,+ur[e]||0));var a=Array.isArray(up[e])?up[e]:[];cc.pl[e]=[0,1,2].map(function(i){return Math.max(0,Math.min(10,a[i]|0));});});
   cc.aw=u.aw===1||u.aw===true;cc.qi=Math.max(0,+u.qi||0);cc.rl=Math.max(1,Math.min(10,u.rl|0||1));cc.dpg=u.dpg===1||u.dpg===true;cc.eq.w=(typeof u.eq==='string'&&G.TD.byWeapon[u.eq])?u.eq:null;cc.bc=Math.max(0,Math.min(5000,+u.bc||0));cc.codes=Math.max(0,+u.codes||0);G.setPets(d.pets);P.maxHp=100;G.recalc();}
  P.hp=(isFinite(d.hp)&&d.hp>0)?Math.min(P.maxHp,d.hp):P.maxHp;
  if(d.set&&d.set.lang)I18N.set(d.set.lang,true),markLang();
  if(d.stats&&typeof d.stats==='object'){var st=G.stats;st.kills=+d.stats.kills||0;st.steps=+d.stats.steps||0;st.sec=+d.stats.sec||0;}
  if(d.loot&&typeof d.loot==='object'){for(var k in G.loot)delete G.loot[k];for(var n in d.loot){var q=+d.loot[n];if(q>0)G.loot[n]=q;}if(G.lootUI)G.lootUI();}
}
function localGet(uid){var t=ls('tt_save_'+uid);try{return t?JSON.parse(t):null;}catch(e){return null;}}
function localSet(uid,o){ls('tt_save_'+uid,JSON.stringify(o));}
function fetchSave(){
  return req('/rest/v1/saves?select=data,updated_at&user_id=eq.'+encodeURIComponent(S.uid),'GET',null,S.at).then(function(r){
    if(r.ok&&Array.isArray(r.j))return{ok:true,row:r.j[0]||null};
    return{ok:false,r:r};
  },function(){return{ok:false,net:true};});
}

/* ---------- đẩy save lên ---------- */
var lastSt=null;
function status(k,p,bad){lastSt=[k,p,bad];var e=$('accS');if(e){e.textContent=I18N.t(k,p);e.style.color=bad?'#ffb0a0':'#bfe6ff';}}
function hh(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function push(keep,force){
  if(!S||pushing)return Promise.resolve();
  var d=collect(),j=JSON.stringify(d);
  localSet(S.uid,{t:Date.now(),d:d});
  if(!force&&j===lastJson)return Promise.resolve();
  pushing=true;status('st.saving');
  return ensure().then(function(ok){
    if(ok===false){pushing=false;showAuth('err.expired');return;}
    if(ok===null){pushing=false;status('st.offline',null,1);return;}
    return req('/rest/v1/saves?on_conflict=user_id','POST',{user_id:S.uid,version:SAVE_V,data:d,updated_at:new Date().toISOString()},S.at,keep,'resolution=merge-duplicates,return=minimal')
      .then(function(r){
        pushing=false;
        if(r.ok){lastJson=j;lastOk=Date.now();status('st.saved',{t:hh()});}
        else status('st.saverr',{m:rawErr(r).slice(0,40)},1);
      },function(){pushing=false;status('st.offline',null,1);});
  });
}

var ov=document.createElement('div');ov.id='auth';
ov.innerHTML=
'<div class="lg" id="aLang"></div>'+
'<form class="card" id="aForm" autocomplete="on">'+
'<h1 data-i18n="game.name"></h1><p class="sub" data-i18n="auth.sub"></p>'+
'<div class="tabs"><button type="button" id="tLogin" class="on" data-i18n="auth.login"></button><button type="button" id="tReg" data-i18n="auth.reg"></button></div>'+
'<input id="aName" type="text" data-i18n-ph="auth.ph.name" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">'+
'<input id="aPw" type="password" data-i18n-ph="auth.ph.pw" maxlength="64" autocomplete="current-password">'+
'<input id="aPw2" type="password" data-i18n-ph="auth.ph.pw2" maxlength="64" autocomplete="new-password" style="display:none">'+
'<div class="err" id="aErr"></div>'+
'<button class="go" id="aGo" type="submit"></button>'+

'</form>';
document.body.appendChild(ov);
var acc=document.createElement('div');acc.id='acc';acc.innerHTML='<span id="accN"></span> · <span id="accS"></span>';
document.body.appendChild(acc);
/* đếm quãng đường + thời gian chơi (chỉ khi đang chơi) */
var lp=null;
setInterval(function(){
  if(!S||window.__pause)return;
  var P=G.P,st=G.stats;st.sec+=.5;
  if(lp){var d=Math.hypot(P.x-lp.x,P.y-lp.y);if(d<60)st.steps+=d/16;}
  lp={x:P.x,y:P.y};
},500);

function setMode(m){
  mode=m;$('tLogin').className=m==='login'?'on':'';$('tReg').className=m==='reg'?'on':'';
  $('aPw2').style.display=m==='reg'?'block':'none';
  $('aPw').autocomplete=m==='reg'?'new-password':'current-password';
  $('aGo').textContent=I18N.t(m==='reg'?'auth.go.reg':'auth.login');
  $('aErr').textContent='';
}
function showAuth(msg){
  window.__pause=true;S=S&&S.uid?S:null;
  ov.style.display='flex';acc.style.display='none';if(window.TTBag)TTBag.show(false);if(window.TTSet)TTSet.show(false);setMode('login');
  $('aErr').textContent=msg?I18N.t(msg):'';busy=false;$('aGo').disabled=false;
}
function enter(){
  ov.style.display='none';acc.style.display='block';if(window.TTBag)TTBag.show(true);if(window.TTSet)TTSet.show(true);$('accN').textContent=S.name;status('st.loaded');
  window.__pause=false;
  clearInterval(timer);timer=setInterval(function(){push(false,false);},10000);
}
function loadAndEnter(){
  /* lấy save mới nhất giữa máy chủ và bản lưu tạm trên máy */
  return fetchSave().then(function(f){
    var loc=localGet(S.uid),pick=null;
    if(f.ok){
      var srv=f.row?{t:Date.parse(f.row.updated_at)||0,d:f.row.data}:null;
      pick=srv;
      if(loc&&(!srv||loc.t>srv.t+1000))pick=loc;
    }else{
      if(f.r&&(f.r.status===401||f.r.status===403)&&/jwt|token/i.test(rawErr(f.r))){S=null;persist();showAuth('err.expired');return;}
      pick=loc; /* offline hoặc lỗi bảng → dùng bản trên máy */
      if(!f.net)setTimeout(function(){status('st.loaderr',{m:rawErr(f.r).slice(0,36)},1);},300);
    }
    var fromSrv=!!(f.ok&&pick&&f.row&&pick.d===f.row.data);
    if(pick)apply(pick.d);
    lastJson=fromSrv?JSON.stringify(collect()):''; /* bản tạm trên máy mới hơn → để lần lưu kế tiếp đẩy lên */
    if(fromSrv)lastOk=Date.parse(f.row.updated_at)||Date.now();
    enter();
    if(f.ok&&!pick)push(false,true); /* tài khoản mới: tạo dòng save đầu tiên */
    if(G.toast)G.toast(I18N.t(pick?'toast.hello_load':'toast.hello_new',{name:S.name}));
  });
}

$('tLogin').onclick=function(){setMode('login');};
$('tReg').onclick=function(){setMode('reg');};
$('aForm').addEventListener('submit',function(e){
  e.preventDefault();if(busy)return;
  var name=norm($('aName').value),pw=$('aPw').value,err=$('aErr');
  if(!/^[a-z0-9_]{3,20}$/.test(name)){err.textContent=I18N.t('err.name');return;}
  if(pw.length<6){err.textContent=I18N.t('err.pw6');return;}
  if(mode==='reg'&&pw!==$('aPw2').value){err.textContent=I18N.t('err.pwmatch');return;}
  busy=true;$('aGo').disabled=true;err.textContent=I18N.t('err.connecting');
  var p=mode==='reg'?signUp(name,pw):signIn(name,pw);
  p.then(function(res){
    busy=false;$('aGo').disabled=false;
    if(res.s){S=res.s;persist();err.textContent='';loadAndEnter();return;}
    if(res.confirmOn){err.textContent=I18N.t('err.confirm');return;}
    err.textContent=viErr(res.err||{status:0,j:{msg:'unknown'}});
  },function(){busy=false;$('aGo').disabled=false;err.textContent=I18N.t('err.nonet');});
});
function logout(){
  if(!confirm(I18N.t('acc.logout.confirm',{name:S&&S.name})))return;
  push(false,true).then(function(){ls(LSK,null);location.reload();});
}
/* thanh chọn ngôn ngữ trên màn hình đăng nhập */
(function(){var box=$('aLang');I18N.LANGS.forEach(function(L){var b=document.createElement('button');b.type='button';b.textContent=L.n;b.dataset.c=L.c;b.onclick=function(){I18N.set(L.c);};box.appendChild(b);});})();
function markLang(){var b=$('aLang').children;for(var i=0;i<b.length;i++)b[i].className=b[i].dataset.c===I18N.lang?'on':'';}
I18N.on(function(){
  I18N.apply(ov);setMode(mode);markLang();
  if(lastSt&&acc.style.display!=='none')status(lastSt[0],lastSt[1],lastSt[2]);
  if(window.TT&&S&&ov.style.display==='none')push(false,false); /* lưu lựa chọn ngôn ngữ vào tài khoản */
});
I18N.apply(ov);markLang();setMode('login');
addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')push(true,false);});
addEventListener('pagehide',function(){push(true,false);});

/* ---------- khởi động ---------- */
window.__pause=true;
(function boot(){
  var t=ls(LSK);if(t){try{S=JSON.parse(t);}catch(e){S=null;}}
  if(!S||!S.rt){showAuth('');return;}
  ov.style.display='flex';$('aErr').textContent=I18N.t('err.entering');$('aGo').disabled=true;
  ensure().then(function(ok){
    if(ok===false){showAuth('err.expired');return;}
    loadAndEnter(); /* ok===null (offline) → loadAndEnter tự dùng bản lưu trên máy */
  });
})();
window.TT={logout:logout,info:function(){return{name:S?S.name:'',lastOk:lastOk};},state:function(){return{S:S,mode:mode,collect:collect};},push:push,apply:apply,signIn:signIn,signUp:signUp};
})();
