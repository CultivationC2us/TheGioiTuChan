<style>

<script>{{I18N_JS}}</script>

<script>
/* ============================================================
   TU TIÊN · THẾ GIỚI MỚI — bản dựng sạch
   Chỉ giữ: nền (đất/đá/cỏ/biển/gạch) + nhân vật cơ bản + Bạch Khuyển + Thủy Long.
   Mọi tỉ lệ pixel: 1 pixel nhân vật/quái = PX (0.5) đơn vị game. ĐỒNG BỘ MỌI THỨ SAU NÀY THEO PX.
   ============================================================ */
(function(){
I18N.apply();const T=(k,p)=>I18N.t(k,p);
window.addEventListener('error',function(e){try{var p=document.createElement('pre');p.style.cssText='position:fixed;left:0;top:0;right:0;z-index:99999;background:#400;color:#fff;font:11px monospace;padding:6px;margin:0;white-space:pre-wrap';p.textContent='LỖI: '+e.message+' @'+e.lineno;document.body.appendChild(p);}catch(_){}});
const PX=0.5,DPX=0.8333,TILE=16,MW=200,MH=200,ZOOM=1.0;
const IMG={};let ready=0;const NEED=16;
function load(k,src){const i=new Image();i.onload=()=>{ready++;};i.src=src;IMG[k]=i;}
load('player','data:image/webp;base64,{{PLAYER}}');
load('dragon','data:image/webp;base64,{{DRAGON}}');
load('beamA','data:image/webp;base64,{{BEAMA}}');
load('beamB','data:image/webp;base64,{{BEAMB}}');
load('dog','data:image/webp;base64,{{DOG}}');
load('res','data:image/webp;base64,{{RESATLAS}}');
load('mnt','data:image/webp;base64,{{MNTATLAS}}');   /* linh thú cưỡi (mnt/extract_m.py) */
load('it','data:image/webp;base64,{{ITATLAS}}');
load('sk','data:image/webp;base64,{{SKATLAS}}');   /* hiệu ứng công pháp (lib/extract_skill.py) */
load('gl','data:image/webp;base64,{{GLATLAS}}');   /* thư viện đá/linh thạch (lib/extract_all.py) */
load('uia','data:image/webp;base64,{{UIAATLAS}}');
load('uih','data:image/webp;base64,{{UIHATLAS}}'); /* icon UI độ phân giải cao (tên 'h<số>') */ /* thư viện UI mới: nút, khung, icon (lib/extract_all.py) */
load('outfit','data:image/webp;base64,{{OFATLAS}}');load('outfit2','data:image/webp;base64,{{OF2ATLAS}}');load('rings','data:image/webp;base64,{{RINGS}}');load('aura','data:image/webp;base64,{{AURA}}');   /* trang phục (outfit/build_atlas.py) */   /* vũ khí · cuộn · sách · ngọc/bình (it/extract_it.py) */
const SKM={{SKMETA}};const ITM={{ITMETA}};const GLM={{GLMETA}};const UIAM={{UIAMETA}};const UIHM={{UIHMETA}};
const TILEIMG={grass:'{{T_GRASS}}',t4:'{{T_T4}}',t3:'{{T_T3}}',t2:'{{T_T2}}',t16:'{{T_T16}}',t5:'{{T_T5}}'};
let tilesLoaded=0;for(const k in TILEIMG){const i=new Image();i.onload=()=>{tilesLoaded++;};i.src='data:image/webp;base64,'+TILEIMG[k];IMG['tile_'+k]=i;}
ready++; // tile counter dùng riêng

/* ---------- NHÂN VẬT CƠ BẢN (khung 76x90, chân y=71, tâm x=34, vạch yên y=65) ---------- */
const NC={W:76,H:90,CX:34,FEET:71,rows:{idle:0,walk:1,atk:2,hit:3},idleMs:[1200,350,350,70,110,70]};
function ncIdle(t){const T=NC.idleMs.reduce((a,b)=>a+b,0);let m=t%T;for(let i=0;i<6;i++){if(m<NC.idleMs[i])return i;m-=NC.idleMs[i];}return 0;}

/* ---------- BẢN ĐỒ ---------- */
let seed=20261017;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))>>>0;h=Math.imul(h^(h>>>13),1274126177)>>>0;return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function vnoiseP(x,y,px,py){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),m=(a,n)=>((a%n)+n)%n;
  const a=hash(m(xi,px),m(yi,py)),b=hash(m(xi+1,px),m(yi,py)),c=hash(m(xi,px),m(yi+1,py)),d=hash(m(xi+1,px),m(yi+1,py));return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
/* nhiễu tuần hoàn (chu kỳ px,py ô mạng) → địa hình nối liền hai mép bản đồ: thế giới hình xuyến, đi hết một hướng sẽ quay lại */
function fbmP(x,y,px,py){return(vnoiseP(x,y,px,py)*.5+vnoiseP(x*2,y*2,px*2,py*2)*.25+vnoiseP(x*4,y*4,px*4,py*4)*.125+vnoiseP(x*8,y*8,px*8,py*8)*.0625)/.9375;}
function fbm(x,y){return(vnoise(x,y)*.5+vnoise(x*2,y*2)*.25+vnoise(x*4,y*4)*.125+vnoise(x*8,y*8)*.0625)/.9375;}
/* ô: 0 cỏ · 1 đất · 2 đá · 3 đá lát · 4 gạch · 5 nước */
const G=0,D=1,R=2,S=3,B=4,W=5;
const tiles=[];for(let y=0;y<MH;y++)tiles.push(new Uint8Array(MW));
const SPAWN={x:100,y:100},LAKE={x:119,y:100,rx:8,ry:6};
(function gen(){
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    let t=G;
    if(fbmP(x*.07+50,y*.07+10,14,14)>.66)t=D;
    if(fbmP(x*.05+200,y*.05+90,10,10)>.70)t=R;
    tiles[y][x]=t;
  }
  // hồ của Thủy Long
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const dx=(x-LAKE.x)/LAKE.rx,dy=(y-LAKE.y)/(LAKE.ry*(1+.18*Math.sin(x*.7)));if(dx*dx+dy*dy<1+.25*fbm(x*.3,y*.3))tiles[y][x]=W;}
  // sông: từ hồ chảy xuống biển phía tây-nam
  let rx=LAKE.x-3,ry=LAKE.y+LAKE.ry-1;
  for(let i=0;i<260&&rx>10;i++){
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const X=Math.round(rx)+a,Y=Math.round(ry)+b;if(X>0&&Y>0&&X<MW&&Y<MH)tiles[Y][X]=W;}
    rx-=.55+.5*Math.abs(Math.sin(i*.13));ry+=Math.sin(i*.09)*.55+.28;
  }
  // quảng trường gạch + đường đá lát
  for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++){const X=SPAWN.x+x,Y=SPAWN.y+y;tiles[Y][X]=(Math.abs(x)>=5||Math.abs(y)>=5)?S:B;}
  for(let i=7;i<46;i++){for(const [dx,dy] of [[i,0],[-i,0],[0,i],[0,-i]]){for(let w=-1;w<=0;w++){const X=SPAWN.x+dx+(dy===0?0:w),Y=SPAWN.y+dy+(dx===0?0:w);if(tiles[Y]&&tiles[Y][X]!==W)tiles[Y][X]=S;}}}
})();
const isWater=(x,y)=>{const tx=((Math.floor(x/TILE)%MW)+MW)%MW,ty=((Math.floor(y/TILE)%MH)+MH)%MH;return tiles[ty][tx]===W;};
/* nền: cắt ô từ ảnh */
const TEX={};function texInit(){if(TEX.ok)return true;if(tilesLoaded<6)return false;
  const mk=(k,n)=>{const c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(IMG['tile_'+k],0,0,n,n);return c;};
  TEX.g=mk('grass',64);TEX.d=mk('t4',128);TEX.r=mk('t3',128);TEX.s=mk('t2',128);TEX.b=mk('t16',128);TEX.w=mk('t5',128);TEX.ok=1;return true;}
function drawTile(t,tx,ty){const px=tx*TILE,py=ty*TILE;
  if(t===G){ctx.drawImage(TEX.g,(tx&1)*32,(ty&1)*32,32,32,px,py,16.5,16.5);return;}
  const c=t===D?TEX.d:t===R?TEX.r:t===S?TEX.s:t===B?TEX.b:TEX.w;
  ctx.drawImage(c,(tx&3)*32,(ty&3)*32,32,32,px,py,16.5,16.5);}
function tileDeco(t,x,y,tm){const px=x*TILE,py=y*TILE;const nb=(dx,dy)=>tiles[(y+dy+MH)%MH][(x+dx+MW)%MW];
  if(t===W){
    if((x*3+y*5)%4===0){ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.2;ctx.beginPath();const o=Math.sin(tm+x)*3;ctx.moveTo(px+3+o,py+8);ctx.quadraticCurveTo(px+7+o,py+5,px+11+o,py+8);ctx.stroke();}
    ctx.fillStyle='rgba(255,255,255,.7)';
    if(nb(0,-1)!==W)ctx.fillRect(px,py,TILE,2);if(nb(0,1)!==W)ctx.fillRect(px,py+TILE-2,TILE,2);if(nb(-1,0)!==W)ctx.fillRect(px,py,2,TILE);if(nb(1,0)!==W)ctx.fillRect(px+TILE-2,py,2,TILE);
  }else if(t===D){ctx.fillStyle='rgba(120,80,40,.35)';if(nb(0,-1)!==D)ctx.fillRect(px,py,TILE,1.5);if(nb(0,1)!==D)ctx.fillRect(px,py+TILE-1.5,TILE,1.5);if(nb(-1,0)!==D)ctx.fillRect(px,py,1.5,TILE);if(nb(1,0)!==D)ctx.fillRect(px+TILE-1.5,py,1.5,TILE);}
}

/* ---------- TRẠNG THÁI ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1;
function resize(){DPR=Math.min(3,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);}
resize();addEventListener('resize',resize);
const P={x:SPAWN.x*TILE+8,y:SPAWN.y*TILE+10,f:1,hp:100,maxHp:100,atkT:-9999,hitDone:true,hurtT:-9999,inv:0,mv:false,dead:0,spd:64,mp:60,maxMp:60};
const cam={x:P.x,y:P.y};
const dog={x:P.x-18,y:P.y+4,run:false,rt:-999,f:1};
let fxs=[],floaters=[],drops=[],loot={},toastT=0;
const stats={kills:0,steps:0,sec:0};
const keys={};let joy={on:false,id:null,ox:0,oy:0,dx:0,dy:0};
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,2400);}
function lootUI(){const e=document.getElementById('loot');const k=Object.keys(loot);e.innerHTML=k.length?'Túi: '+k.map(n=>n+' ×'+loot[n]).join(', '):'';}

/* ---------- TÀI NGUYÊN · NGŨ HÀNH · LINH CĂN ---------- */
const TD=window.TTData,RMETA={{RESMETA}};
const cult={r:{kim:0,moc:0,thuy:0,hoa:0,tho:0},pl:{kim:[0,0,0],moc:[0,0,0],thuy:[0,0,0],hoa:[0,0,0],tho:[0,0,0]},aw:false,qi:0,rl:1,dpg:false,eq:{w:null,o:null,h:null,g:null,r:null,l:null,p:'bach_khuyen'},ins:{},bc:0,codes:0};
const nodes=[],nodeCell=new Map(),respawnQ=[];   /* node: {g,x,y,h,gone,shk}; chia ô 4x4 để tìm nhanh */
const ckey=n=>(n.x/TILE>>2)+','+(n.y/TILE>>2);
function cellAdd(n){const k=ckey(n);let a=nodeCell.get(k);if(!a)nodeCell.set(k,a=[]);a.push(n);}
function cellDel(n){const a=nodeCell.get(ckey(n));if(a){const i=a.indexOf(n);if(i>=0)a.splice(i,1);}}
(function placeRes(){
  const byKT={};for(const g of TD.RES){(byKT[g.kind+g.tier]=byKT[g.kind+g.tier]||[]).push(g);}
  const okT=(x,y)=>{const r=tiles[y];return r&&(r[x]===G||r[x]===D||r[x]===R);};
  for(let cy=0;cy<MH/4;cy++)for(let cx=0;cx<MW/4;cx++){
    if(hash(cx*7+1,cy*13+5)>.34)continue;
    const tx=cx*4+Math.floor(hash(cx+3,cy+91)*4),ty=cy*4+Math.floor(hash(cx+17,cy+5)*4);
    if(tx<2||ty<2||tx>=MW-2||ty>=MH-2||!okT(tx,ty))continue;
    let bad=false;for(let a=-1;a<=1&&!bad;a++)for(let b=-1;b<=1;b++){const q=tiles[ty+b][tx+a];if(q===W||q===S||q===B){bad=true;break;}}
    if(bad)continue;
    const d=Math.hypot(tx-SPAWN.x,ty-SPAWN.y);if(d<9)continue;
    const lx=(tx-LAKE.x)/(LAKE.rx+3),ly=(ty-LAKE.y)/(LAKE.ry+3);if(lx*lx+ly*ly<1)continue;
    const rt=hash(cx+31,cy+7),w=d<35?[.88,.12]:d<70?[.45,.45]:[.2,.5];
    const tier=rt<w[0]?1:(rt<w[0]+w[1]?2:3);
    const t0=tiles[ty][tx],ro=hash(cx+51,cy+23),kind=(t0===R?ro<.9:t0===D?ro<.45:ro<.12)?'ore':(ro<.5?'tree':'herb');
    let pool=byKT[kind+tier];if(!pool)pool=byKT[(kind==='ore'?'herb':kind)+tier];
    if(!pool)continue;
    {const af=TD.AFF[t0],pf=af&&pool.filter(x=>af.includes(x.el));if(pf&&pf.length&&hash(cx+13,cy+61)<.85)pool=pf;}   /* Hỏa/Thổ/Kim ưa cát & đá; Mộc/Thủy ưa cỏ */
    const g=pool[Math.floor(hash(cx+71,cy+3)*pool.length)%pool.length];
    const n={g,x:tx*TILE+4+hash(cx,cy+41)*8,y:ty*TILE+13+hash(cx+9,cy)*3,h:0,gone:false,shk:-9999};
    nodes.push(n);cellAdd(n);
  }
})();
function nodesNear(x,y,rc){const out=[],cx=x/TILE>>2,cy=y/TILE>>2;for(let i=-rc;i<=rc;i++)for(let j=-rc;j<=rc;j++){const a=nodeCell.get((cx+i)+','+(cy+j));if(a)for(const n of a)out.push(n);}return out;}
function randomSpot(g){ /* chỗ mới ngẫu nhiên cho nguồn vừa bị khai thác: hợp địa hình, xa người chơi, không đè nguồn khác */
  const minD=g.tier===3?45:g.tier===2?20:9;
  for(let i=0;i<500;i++){
    const tx=2+Math.floor(Math.random()*(MW-4)),ty=2+Math.floor(Math.random()*(MH-4)),t0=tiles[ty][tx];
    if(t0!==G&&t0!==D&&t0!==R)continue;
    if(g.kind==='ore'?(t0===G&&Math.random()>.12):(t0===R&&Math.random()>.2))continue;
    {const af=TD.AFF[t0];if(af&&!af.includes(g.el)&&Math.random()>.15)continue;}
    let bad=false;for(let a=-1;a<=1&&!bad;a++)for(let b=-1;b<=1;b++){const q=tiles[ty+b][tx+a];if(q===W||q===S||q===B){bad=true;break;}}
    if(bad)continue;
    if(Math.hypot(tx-SPAWN.x,ty-SPAWN.y)<minD)continue;
    const lx=(tx-LAKE.x)/(LAKE.rx+3),ly=(ty-LAKE.y)/(LAKE.ry+3);if(lx*lx+ly*ly<1)continue;
    const x=tx*TILE+4+Math.random()*8,y=ty*TILE+13+Math.random()*3;
    if(Math.hypot(x-P.x,y-P.y)<260)continue;
    if(nodesNear(x,y,1).some(o=>Math.hypot(o.x-x,o.y-y)<40))continue;
    return {x,y};
  }
  return null;
}
function respawnTick(t){for(let i=respawnQ.length-1;i>=0;i--){const r=respawnQ[i];if(t<r.at)continue;const n=r.n,s=randomSpot(n.g);
  if(!s){r.at=t+5000;continue;}n.x=s.x;n.y=s.y;n.h=0;n.gone=false;n.shk=-9999;cellAdd(n);respawnQ.splice(i,1);}}
function harvest(t){ /* trả về true nếu trúng một nguồn tài nguyên */
  let best=null,bd=1e9;
  for(const n of nodesNear(P.x,P.y,1)){if(n.gone)continue;const dx=(n.x-P.x)*P.f,d=Math.hypot(n.x-P.x,n.y-6-(P.y-6));if(dx>-8&&d<34&&d<bd){best=n;bd=d;}}
  if(!best)return false;
  best.h++;best.shk=t;const g=best.g;
  floaters.push({x:best.x,y:best.y-22,t0:t,s:best.h+'/'+g.hits,c:'#ffe58f'});
  if(best.h>=g.hits){best.gone=true;cellDel(best);respawnQ.push({n:best,at:t+TD.RESPAWN});const c=1+(Math.random()<.35?1:0);
    for(let i=0;i<c;i++)drops.push({x:best.x+(i?10:-4)+(Math.random()-.5)*8,y:best.y-6,t0:t,n:g.item,ic:g.id});}
  return true;
}
function refineEl(el){ /* nguyên liệu hệ el → điểm hệ el (tối đa NEED); trả về số điểm cộng */
  let gain=0;
  const list=TD.RES.filter(g=>g.el===el).sort((a,b)=>b.pts-a.pts);   /* dùng loại quý trước */
  for(const g of list){while((loot[g.item]|0)>0&&cult.r[el]<TD.NEED){loot[g.item]--;if(!loot[g.item])delete loot[g.item];const add=Math.min(g.pts,TD.NEED-cult.r[el]);cult.r[el]+=add;gain+=add;}}
  if(gain){lootUI();toast(T('toast.refine',{n:gain,el:T('el.'+el)}));}else toast(T('toast.refine0',{el:T('el.'+el)}));
  return gain;
}
function lootDec(n){loot[n]--;if(!(loot[n]>0)){delete loot[n];if(cult.eq.w===n){cult.eq.w=null;recalc();}['o','h','g','r','l'].forEach(k=>{if(cult.eq[k]===n){cult.eq[k]=null;recalc();}});}}
