name: Game build and smoke test

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Python runtime
        run: python --version
      - name: Install test dependency
        run: python -m pip install --upgrade pip playwright pillow
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check build manifest
        run: python src/nw/check_build_manifest.py
      - name: Build game bundle
        run: python src/nw/build.py
      - name: Check Python syntax
        run: python -m compileall -q src/nw
      - name: Verify bundle
        run: |
          test -s index.html
          test -s src/nw/game.html
          ! grep -q '{{[A-Z0-9_]*}}' index.html
      - name: Test login and save flow
        run: python src/nw/test_auth.py

      - name: Test inventory UI and persistence
        run: python src/nw/test_bag.py

      - name: Test cultivation and crafting
        run: python src/nw/test_realm.py

      - name: Commit rebuilt GitHub Pages bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html is already up to date"
          else
            git commit -m "[build] Regenerate game bundle"
            git push
          fi
