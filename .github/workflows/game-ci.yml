name: Game build and smoke test

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pip playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build game bundle
        run: python src/nw/build.py
      - name: Check Python syntax
        run: python -m compileall -q src/nw
      - name: Verify bundle
        run: |
          test -s index.html
          test -s src/nw/game.html
          ! grep -q '{{[A-Z0-9_]*}}' index.html
      - name: Test login and save flow
        run: python src/nw/test_auth.py
